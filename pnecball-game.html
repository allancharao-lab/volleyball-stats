<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Game</title>

    <link rel="icon" type="image/png" href="icone.png">
    <style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

    width: 100vw;
    height: 100vh;
    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: gray;

    display: flex;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden;
}


/* =========================
   CAMPO
========================= */

.field {

    position: relative;

    width: 700px;
    height: 400px;

    margin-right: -245px;

    background: #d99a3d;

    border: 5px solid white;

    border-radius: 10px;

    box-shadow:
        0 0 0 4px #181818,
        0 20px 50px rgba(0, 0, 0, 0.7);

    overflow: visible;
}


/* =========================
   REDE
========================= */

.net {

    position: absolute;

    left: 50%;
    top: 0%;

    transform: translateX(-50%);

    width: 7px;
    height: 100%;

    background: white;

    box-shadow:
        0 0 8px rgba(0, 0, 0, 0.6);

    z-index: 5;
}


/* =========================
   LINHAS DE ATAQUE
========================= */

.attack-line-left {

    position: absolute;

    left: 15%;
    top: 0;

    width: 3px;
    height: 100%;

    background: rgba(255, 255, 255, 0.9);

    z-index: 1;
}


.attack-line-right {

    position: absolute;

    right: 25%;
    top: 0;

    width: 3px;
    height: 100%;

    background: rgba(255, 255, 255, 0.9);

    z-index: 1;
}


/* =========================
   ÁREA DOS JOGADORES
========================= */

.players {

    position: absolute;

    width: 40%;
    height: 80%;

    z-index: 10;
}


/* =========================
   JOGADORES
========================= */

.Player {

    position: absolute;

    width: 77px;
    height: 77px;

    border-radius: 50%;

    background: linear-gradient(
        145deg,
        #292929,
        #111111
    );

    border: 2px solid #f5c542;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: white;

    font-size: 14px;

    font-weight: bold;

    text-transform: uppercase;

    box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.6);

    cursor: pointer;

    transition: 0.2s ease;
}


/* =========================
   NÚMERO DO JOGADOR
========================= */

.Player::before {

    content: attr(data-number);

    position: absolute;

    top: -7px;
    left: -7px;

    width: 25px;
    height: 25px;

    border-radius: 50%;

    background: #f5c542;

    color: #111;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 9px;

    font-weight: 900;

    border: 2px solid #111;
}


/* =========================
   HOVER
========================= */

.Player:hover {

    transform: scale(1.15);

    border-color: white;

    box-shadow:
        0 0 15px rgba(245, 197, 66, 0.7);
}

.Player.pos-1 {

    left: 30%;
    top: -15%;
}


.Player.pos-2 {

    left: -20%;
    top: 50%;
}

.Player.pos-3 {

    left: 30%;
    top: 115%;
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 1050px) {

    .field {

        width: 90vw;
        height: 55vw;

        min-height: 450px;
    }


    .players {

        left: 4%;
        width: 42%;
    }


    .Player {

        width: 48px;
        height: 48px;

        font-size: 7px;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .field {

        width: 95vw;
        height: 500px;
    }


    .players {

        left: 4%;

        top: 18%;

        width: 42%;
        height: 65%;
    }


    .Player {

        width: 40px;
        height: 40px;

        font-size: 6px;
    }


    .Player::before {

        width: 15px;
        height: 15px;

        font-size: 7px;

        top: -5px;
        left: -5px;
    }


    .Player.libero {

        width: 35px;
        height: 35px;
    }
}

/* =========================
   SORTEIO DA EQUIPA
========================= */

            left: 40px;

        }


        .team-name {

            font-size: 24px;

            color: #f5c542;
        }

        }

        .character {

            font-size: 14px;

        }

        .character-positions {

        .character-disabled:hover {

        }

        .position-overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.65);

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 1000;
        }

        .position-popup {
            width: 260px;

            padding: 25px;

            background: #292929;

            border: 2px solid #f5c542;

            border-radius: 10px;

            text-align: center;

            color: white;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .position-popup h3 {
            margin-bottom: 8px;
        }

        .position-popup p {
            margin-bottom: 20px;

            font-weight: bold;
        }

        .position-popup button {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            border: none;
            border-radius: 6px;
            background: #f5c542;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        .position-popup button:hover {
            background: #ffd966;
        }

        .position-popup .cancelar {
            background: #555;
            color: white;
        }

        .position-popup .cancelar:hover {
            background: #666;
        }

        .comecarJogo{
            color: white;
            background: #555;
            border-radius: 6px;
            width: 95%;
            padding: 10px;
            margin-top: 7px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .comecarJogo:hover{
        background: #666;
        }

        .texto-dourado {
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            font-size: 14px;
            /* Gradiente com tons de dourado */
            background: linear-gradient(45deg, #b38728, #fbf5b7, #bf953f, #fcf6ba, #b38728);
            background-size: 400% 100%;
            
            
            /* Aplica o gradiente apenas ao texto */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            /* Aplica a animação */
            animation: brilhaOuro 6s linear infinite;
            }

            /* Cria o movimento do brilho dourado */
            @keyframes brilhaOuro {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 50% 0%;
            }
            }   

            .Player span {
                position: relative;
                z-index: 2;
            }

    </style>

</head>


<body>

     <div class="team-selection">

        <h2 id="teste">Equipa sorteada</h2>

        <div class="team-name" id="team-name">
            ?
        </div>

        <button onclick="iniciarJogo()" id="start-game" class="comecarJogo">
            Começar jogo
        </button>

        <div id="team-players"></div>

    </div>

    <div class="field">

        <div class="net"></div>
        <div class="attack-line-left"></div>
        <div class="attack-line-right"></div>
        <div class="players">

            <div class="Player pos-1" data-number="1" id="player-1">
                LW
            </div>


            <div class="Player pos-2" data-number="2" id="player-2">
                CM
            </div>


            <div class="Player pos-3" data-number="3" id="player-3">
                RW
            </div>


        </div>

    </div>


    <script>

    // ======================================================
    // EQUIPA DE TESTE
    // ======================================================

    const equipaTeste = "Barreiro";

    let equipes = [
    "Barreiro 2024",
    "Barreiro 2025",
    "Barreiro 2026",
    "Setúbal 2025",
    "Corroios 2026"
    ];


    // ======================================================
    // JOGADORES PREDEFINIDOS
    // ======================================================

    let personagens = [

        {
            id: "1",
            nome: "Állan",
            ataque: 90,
            servico: 93,
            passe: 95,
            iq: 91,
            defesa: 86,
            fisico: 89,
            overall: 91,
            posicao1: "LW",
            posicao2: "CM",
            time: "Barreiro"
        },

        {
            id: "2",
            nome: "Leonardo",
            ataque: 81,
            servico: 91,
            passe: 87,
            iq: 82,
            defesa: 82,
            fisico: 87,
            overall: 85,
            posicao1: "CM",
            posicao2: "LW",
            time: "Barreiro"
        },

        {
            id: "3",
            nome: "Micael",
            ataque: 88,
            servico: 90,
            passe: 92,
            iq: 85,
            defesa: 84,
            fisico: 73,
            overall: 85,
            posicao1: "CM",
            posicao2: "RW",
            time: "Barreiro"
        },

        {
            id: "4",
            nome: "Diego",
            ataque: 87,
            servico: 88,
            passe: 73,
            iq: 76,
            defesa: 75,
            fisico: 93,
            overall: 82,
            posicao1: "RW",
            posicao2: "LW",
            time: "Barreiro"
        }

    ];


    // ======================================================
    // POSIÇÕES DO CAMPO
    // ======================================================

    const posicoes = ["LW", "CM", "RW"];


    // ======================================================
    // JOGADORES ESCOLHIDOS
    // ======================================================

    let jogadoresEscolhidos = [];


    // ======================================================
    // POSIÇÕES OCUPADAS
    // ======================================================

    let posicoesOcupadas = [];


    // ======================================================
    // MOSTRAR EQUIPA
    // ======================================================

    function mostrarEquipe() {

        const teamName =
            document.getElementById("team-name");

        if (teamName) {

            teamName.textContent =
                equipaTeste;

        }

    }


    // ======================================================
    // VERIFICAR SE O JOGADOR PODE JOGAR NA POSIÇÃO
    // ======================================================

    function podeJogarNaPosicao(jogador,posicao) {

        const posicao1 =
            jogador.posicao1
                .trim()
                .toUpperCase();

        const posicao2 =
            jogador.posicao2
                .trim()
                .toUpperCase();


        if (posicao1 === posicao) {
            return true;
        }


        if (posicao2 === posicao) {
            return true;
        }


        return false;

    }


    // ======================================================
    // VERIFICAR SE JOGADOR JÁ FOI ESCOLHIDO
    // ======================================================

    function jogadorJaEscolhido(jogador) {

        return jogadoresEscolhidos.some(
            jogadorEscolhido =>
                jogadorEscolhido.id === jogador.id
        );

    }


    // ======================================================
    // MOSTRAR JOGADORES
    // ======================================================

    function mostrarJogadoresDaEquipe() {

        const container =
            document.getElementById(
                "team-players"
            );


        if (!container) {

            console.error(
                "Não foi encontrado #team-players"
            );

            return;
        }


        container.innerHTML = "";


        personagens.forEach(jogador => {

            const jogadorDiv =
                document.createElement("div");


            jogadorDiv.classList.add(
                "character"
            );


            // ==========================================
            // NOME
            // ==========================================

            const nome =
                document.createElement("div");

            nome.classList.add(
                "character-name"
            );

            nome.textContent =
                jogador.nome;

            if (jogador.overall >= 90){
                nome.classList.add("texto-dourado");

            }


            // ==========================================
            // POSIÇÕES
            // ==========================================

            const posicoesJogador =
                document.createElement("div");

            posicoesJogador.classList.add(
                "character-positions"
            );


            let textoPosicoes =
                jogador.posicao1;


            if (
                jogador.posicao2 &&
                jogador.posicao2
                    .toLowerCase() !== "none"
            ) {

                textoPosicoes +=
                    " / " +
                    jogador.posicao2;

            }


            posicoesJogador.textContent =
                textoPosicoes;


            // ==========================================
            // OVERALL
            // ==========================================

            const overall =
                document.createElement("div");

            overall.classList.add(
                "character-overall"
            );

            overall.textContent =
                "OVR " +
                jogador.overall;


            // ==========================================
            // ADICIONAR AO CARD
            // ==========================================

            jogadorDiv.appendChild(nome);

            jogadorDiv.appendChild(
                posicoesJogador
            );

            jogadorDiv.appendChild(
                overall
            );


            // ==========================================
            // VERIFICAR SE JÁ FOI ESCOLHIDO
            // ==========================================

            const jaEscolhido =
                jogadorJaEscolhido(
                    jogador
                );


            // ==========================================
            // VERIFICAR POSIÇÕES DISPONÍVEIS
            // ==========================================

            const podeJogarEmAlgumaPosicao =
                posicoes.some(posicao => {

                    if (
                        posicoesOcupadas
                            .includes(posicao)
                    ) {

                        return false;

                    }


                    return podeJogarNaPosicao(jogador,posicao);

                });


            // ==========================================
            // DESATIVAR
            // ==========================================

            if (
                jaEscolhido ||
                !podeJogarEmAlgumaPosicao
            ) {

                jogadorDiv.classList.add(
                    "character-disabled"
                );

                jogadorDiv.style.cursor =
                    "not-allowed";

            }

            else {

                jogadorDiv.addEventListener(
                    "click",
                    function () {

                        escolherPosicaoDoJogador(
                            jogador
                        );

                    }
                );

            }


            container.appendChild(
                jogadorDiv
            );

        });

    }

    // ======================================================
// ESCOLHER JOGADOR
// ======================================================

function escolherJogador(
    jogador,
    posicaoEscolhida
) {

    // ==========================================
    // SEGURANÇA
    // ==========================================

    if (
        !podeJogarNaPosicao(
            jogador,
            posicaoEscolhida
        )
    ) {
        return;
    }


    if (
        jogadorJaEscolhido(
            jogador
        )
    ) {
        return;
    }


    if (
        posicoesOcupadas.includes(
            posicaoEscolhida
        )
    ) {
        return;
    }


    // ==========================================
    // GUARDAR JOGADOR
    // ==========================================

    jogadoresEscolhidos.push({
        ...jogador,
        posicaoEscolhida: posicaoEscolhida
    });


    // ==========================================
    // MARCAR POSIÇÃO
    // ==========================================

    posicoesOcupadas.push(
        posicaoEscolhida
    );


    // ==========================================
    // DESCOBRIR ESPAÇO DO CAMPO
    // ==========================================

    const indiceCampo =
        posicoes.indexOf(
            posicaoEscolhida
        );


    // ==========================================
    // COLOCAR JOGADOR NO CAMPO
    // ==========================================

    colocarJogadorNoCampo(
        jogador,
        indiceCampo,
        posicaoEscolhida
    );


    // ==========================================
    // VERIFICAR SE COMPLETOU
    // ==========================================

    if (
        posicoesOcupadas.length ===
        posicoes.length
    ) {

        terminarEquipe();

        return;

    }


    // ==========================================
    // ATUALIZAR LISTA
    // ==========================================

    mostrarJogadoresDaEquipe();

}

    // ======================================================
    // ESCOLHER POSIÇÃO DO JOGADOR
    // ======================================================

    function escolherPosicaoDoJogador(
        jogador
    ) {

        const posicoesJogador = [];


        // ==========================================
        // POSIÇÃO 1
        // ==========================================

        if (jogador.posicao1 &&jogador.posicao1.toLowerCase() !== "none") {

            const posicao =
                jogador.posicao1
                    .toUpperCase();


            if (
                !posicoesOcupadas
                    .includes(posicao)
            ) {

                posicoesJogador.push(
                    posicao
                );

            }

        }


        // ==========================================
        // POSIÇÃO 2
        // ==========================================

        if (
            jogador.posicao2 &&
            jogador.posicao2
                .toLowerCase() !== "none"
        ) {

            const posicao =
                jogador.posicao2
                    .toUpperCase();


            if (
                !posicoesOcupadas
                    .includes(posicao)
            ) {

                posicoesJogador.push(
                    posicao
                );

            }

        }


        // ==========================================
        // NENHUMA POSIÇÃO DISPONÍVEL
        // ==========================================

        if (
            posicoesJogador.length === 0
        ) {

            return;

        }


        // ==========================================
        // APENAS UMA POSIÇÃO
        // ==========================================

        if (
            posicoesJogador.length === 1
        ) {

            escolherJogador(jogador,posicoesJogador[0]);
            return;

        }


        // ==========================================
        // CRIAR OVERLAY
        // ==========================================

        const overlay =
            document.createElement("div");

        overlay.classList.add(
            "position-overlay"
        );


        // ==========================================
        // POPUP
        // ==========================================

        const popup =
            document.createElement("div");

        popup.classList.add(
            "position-popup"
        );


        // ==========================================
        // TÍTULO
        // ==========================================

        const titulo =
            document.createElement("h3");

        titulo.textContent =
            "Escolher posição";


        // ==========================================
        // NOME
        // ==========================================

        const nome =
            document.createElement("p");

        nome.textContent =
            jogador.nome;


        popup.appendChild(titulo);

        popup.appendChild(nome);


        // ==========================================
        // BOTÕES DAS POSIÇÕES
        // ==========================================

        posicoesJogador.forEach(
            posicao => {

                const botao =
                    document.createElement(
                        "button"
                    );


                botao.textContent =
                    posicao;


                botao.addEventListener(
                    "click",
                    function () {

                        escolherJogador(
                            jogador,
                            posicao
                        );


                        overlay.remove();

                    }
                );


                popup.appendChild(
                    botao
                );

            }
        );


        // ==========================================
        // CANCELAR
        // ==========================================

        const cancelar =
            document.createElement(
                "button"
            );


        cancelar.textContent =
            "Cancelar";


        cancelar.classList.add(
            "cancelar"
        );


        cancelar.addEventListener(
            "click",
            function () {

                overlay.remove();

            }
        );


        popup.appendChild(
            cancelar
        );


        overlay.appendChild(
            popup
        );


        document.body.appendChild(
            overlay
        );

    }
// ======================================================
// COLOCAR JOGADOR NO CAMPO
// ======================================================

function colocarJogadorNoCampo(
    jogador,
    posicaoCampo,
    posicaoEscolhida
) {

    const jogadorCampo =
        document.getElementById(
            "player-" +
            (posicaoCampo + 1)
        );


    if (!jogadorCampo) {

        console.error(
            "Não foi encontrado player-" +
            (posicaoCampo + 1)
        );

        return;

    }


    // ==========================================
    // LIMPAR NOME/CONTEÚDO ANTERIOR
    // ==========================================

    jogadorCampo.innerHTML = "";


    // ==========================================
    // CRIAR NOME DO JOGADOR
    // ==========================================

    const nomeJogador =
        document.createElement("span");


    nomeJogador.textContent =
        jogador.nome;


    // ==========================================
    // OVR 90+ = NOME DOURADO
    // ==========================================

    if (jogador.overall >= 90) {

        nomeJogador.classList.add(
            "texto-dourado"
        );

    }


    // ==========================================
    // COLOCAR NOME DENTRO DA BOLINHA
    // ==========================================

    jogadorCampo.appendChild(
        nomeJogador
    );


    // ==========================================
    // GUARDAR ID DO JOGADOR
    // ==========================================

    jogadorCampo.dataset.playerId =
        jogador.id;


    // ==========================================
    // GUARDAR POSIÇÃO
    // ==========================================

    jogadorCampo.dataset.position =
        posicaoEscolhida;


    // ==========================================
    // GUARDAR NÚMERO
    // ==========================================

    jogadorCampo.dataset.number =
        posicaoCampo + 1;


    // ==========================================
    // MARCAR COMO ESCOLHIDO
    // ==========================================

    jogadorCampo.classList.add(
        "player-selected"
    );


    console.log(
        jogador.nome +
        " colocado em " +
        posicaoEscolhida
    );

}



    // ======================================================
    // TERMINAR EQUIPA
    // ======================================================

    function terminarEquipe() {

        console.log(
            "=============================="
        );

        console.log(
            "EQUIPA COMPLETA!"
        );

        console.log(
            "=============================="
        );


        jogadoresEscolhidos.forEach(
            jogador => {

                console.log(
                    jogador.posicaoEscolhida +

/*
=========================================================
ROLAGEM DE SORTE
=========================================================

Retorna um valor entre -10 e +10.

Exemplo:

90 + rolagem()

pode resultar em:

80
81
...
90
...
100
*/

function rolagem() {

    return Math.floor(Math.random() * 21) - 10;
}


/*

SORTEAR EQUIPA ADVERSÁRIA

*/

function sortearEquipeAdversaria() {

/*
=========================================================
CONSTRUIR EQUIPA ADVERSÁRIA
=========================================================

Escolhe 3 jogadores aleatoriamente da equipa
sorteada.
*/

async function construirEquipaAdversaria() {

    const resposta = await fetch("players.txt");

    const texto = await resposta.text();

    const linhas = texto.trim().split("\n");

    const jogadores = [];

    for (let i = 0; i < linhas.length; i++) {

        const dados = linhas[i].trim().split(";");

        if (dados.length < 12) {
            continue;
        }

        jogadores.push({
            id: dados[0],
            nome: dados[1],
            ataque: Number(dados[2]),
            servico: Number(dados[3]),
            passe: Number(dados[4]),
            iq: Number(dados[5]),
            defesa: Number(dados[6]),
            fisico: Number(dados[7]),
            overall: Number(dados[8]),
            posicao1: dados[9],
            posicao2: dados[10],
            time: dados[11]
        });
    }

    // Jogadores pertencentes à equipa adversária
    const jogadoresDaEquipa = jogadores.filter(
        jogador => jogador.time === equipaAdversaria
    );

    if (jogadoresDaEquipa.length < 3) {

        console.error(
            "A equipa " + equipaAdversaria +
            " não tem jogadores suficientes."
        );

        jogadoresAdversarios = [];

        return false;
    }

    // Baralhar jogadores
    jogadoresDaEquipa.sort(() => Math.random() - 0.5);

    // Escolher 3
    jogadoresAdversarios = jogadoresDaEquipa.slice(0, 3);

    console.log("Equipa adversária:", equipaAdversaria);
    console.log("Jogadores adversários:", jogadoresAdversarios);

    return true;
}

/*
=========================================================
ESCOLHER SERVIDOR
=========================================================
*/

function escolherServidor(jogadores) {

    let indice =
        Math.floor(Math.random() * jogadores.length);
    return jogadores[indice];
}


/*
=========================================================
ESCOLHER RECEPTOR
=========================================================

Neste momento escolhemos aleatoriamente um dos
3 jogadores.

Mais tarde podemos fazer com que jogadores com
melhor defesa tenham maior probabilidade de receber.
*/

function escolherReceptor(jogadores) {

    let indice =
        Math.floor(
            Math.random() * jogadores.length
        );

    return jogadores[indice];
}


/*
=========================================================
RESOLVER SERVIÇO
=========================================================

SERVIÇO vs DEFESA

Diferença >= 15
→ ACE

Diferença >= 5
→ receção difícil

Diferença >= -4
→ receção normal

Diferença < -4
→ receção fácil
*/

function resolverServico(servidor, receptor) {

    let valorServico =
        servidor.servico + rolagem();

    let valorDefesa =
        receptor.defesa + rolagem();

    let diferenca =
        valorServico - valorDefesa;

    console.log(
        servidor.nome +
        " Serviço: " +
        valorServico
    );

    console.log(
        receptor.nome +
        " Defesa: " +
        valorDefesa
    );


    /*
    ACE
    */

    if (diferenca >= 15) {

        return {

            tipo: "ACE",

            servidor: servidor,

            receptor: receptor,

            valorServico: valorServico,

            valorDefesa: valorDefesa,

            dificuldade: 0
        };
    }


    /*
    RECEÇÃO DIFÍCIL
    */

    if (diferenca >= 5) {

        return {

            tipo: "RECEPCAO_DIFICIL",

            servidor: servidor,

            receptor: receptor,

            valorServico: valorServico,

            valorDefesa: valorDefesa,

            dificuldade: diferenca
        };
    }


    /*
    RECEÇÃO NORMAL
    */

    if (diferenca >= -4) {

        return {

            tipo: "RECEPCAO_NORMAL",

            servidor: servidor,

            receptor: receptor,

            valorServico: valorServico,

            valorDefesa: valorDefesa,

            dificuldade: 0
        };
    }


    /*
    RECEÇÃO FÁCIL
    */

    return {

        tipo: "RECEPCAO_FACIL",

        servidor: servidor,

        receptor: receptor,

        valorServico: valorServico,

        valorDefesa: valorDefesa,

        dificuldade: 0
    };
}


/*
=========================================================
ESCOLHER LEVANTADOR
=========================================================

O receptor é excluído.

Dos dois jogadores restantes, escolhemos aquele
com melhor combinação:

60% passe
40% IQ
*/

function escolherLevantador(jogadores, receptor) {

    // Retira o jogador que fez o primeiro toque
    let candidatos = jogadores.filter(
        jogador => jogador.id !== receptor.id
    );

    // Se não houver jogadores disponíveis
    if (candidatos.length === 0) {
        return null;
    }

    // Escolhe aleatoriamente um dos dois jogadores
    let indice = Math.floor(Math.random() * candidatos.length);

    return candidatos[indice];
}


/*
=========================================================
CALCULAR BÓNUS DO LEVANTAMENTO
=========================================================

90+ → +10
80-89 → +7
70-79 → +5
60-69 → +2
45-59 → 0
<45 → -5
*/

function calcularBonusLevantamento(
    valorLevantamento
) {

    if (valorLevantamento >= 90) {

        return 10;
    }

    if (valorLevantamento >= 80) {

        return 7;
    }

    if (valorLevantamento >= 70) {

        return 5;
    }

    if (valorLevantamento >= 60) {

        return 2;
    }

    if (valorLevantamento >= 45) {

        return 0;
    }

    return -5;
}


/*
=========================================================
RESOLVER LEVANTAMENTO
=========================================================

O levantamento utiliza:

60% PASSE
40% IQ
+ sorte
- dificuldade da receção

Depois transforma o resultado num bónus
para o atacante.
*/

function resolverLevantamento(
    levantador,
    resultadoRececao
) {

    let valorPasse =
        levantador.passe * 0.6;

    let valorIQ =
        levantador.iq * 0.4;

    let sorte =
        rolagem();

    let dificuldade =
        resultadoRececao.dificuldade || 0;


    let valorLevantamento =
        valorPasse +
        valorIQ +
        sorte -
        dificuldade;


    /*
    Limitar entre 0 e 100
    */

    valorLevantamento =
        Math.max(
            0,
            Math.min(
                100,
                valorLevantamento
            )
        );


    let bonusAtaque =
        calcularBonusLevantamento(
            valorLevantamento
        );


    console.log(
        levantador.nome +
        " fez o levantamento: " +
        valorLevantamento
    );

    console.log(
        "Bónus de ataque: +" +
        bonusAtaque
    );


    return {

        levantador: levantador,

        valor: valorLevantamento,

        bonusAtaque: bonusAtaque
    };
}


/*
=========================================================
ESCOLHER ATACANTE
=========================================================

O atacante tem de ser:

- diferente do receptor
- diferente do levantador

Num 3x3 sobra exatamente um jogador.
*/

function escolherAtacante(
    jogadores,
    receptor,
    levantador
) {

    let candidatos =
        jogadores.filter(
            jogador =>
                jogador.id !== receptor.id &&
                jogador.id !== levantador.id
        );


    if (candidatos.length === 0) {

        return null;
    }


    /*
    Normalmente haverá apenas um jogador.
    */

    if (candidatos.length === 1) {

        return candidatos[0];
    }


    /*
    Segurança caso no futuro o número
    de jogadores seja diferente.
    */

    candidatos.sort(
        (a, b) =>
            b.ataque - a.ataque
    );


    return candidatos[0];
}


/*
=========================================================
RESOLVER ATAQUE
=========================================================

Ataque recebe:

ataque do jogador
+
bónus do levantamento
+
sorte

Depois enfrenta a defesa do adversário.
*/

function resolverAtaque(
    atacante,
    defensores,
    bonusAtaque
) {

    let valorAtaque =
        atacante.ataque +
        bonusAtaque +
        rolagem();


    let defensor =
        escolherReceptor(
            defensores
        );


    let valorDefesa =
        defensor.defesa +
        rolagem();


    let diferenca =
        valorAtaque -
        valorDefesa;


    console.log(
        atacante.nome +
        " Ataque: " +
        valorAtaque
    );

    console.log(
        defensor.nome +
        " Defesa: " +
        valorDefesa
    );

    console.log(
        "Diferença: " +
        diferenca
    );


    /*
    ATAQUE VENCEDOR
    */

    if (diferenca >= 10) {

        return {

            tipo: "ATAQUE",

            vencedor: atacante,

            defensor: defensor,

            valorAtaque: valorAtaque,

            valorDefesa: valorDefesa
        };
    }


    /*
    A BOLA CONTINUA EM JOGO
    */

    return {

        tipo: "RALLY",

        atacante: atacante,

        defensor: defensor,

        valorAtaque: valorAtaque,

        valorDefesa: valorDefesa
    };
}


/*
=========================================================
DAR PONTO
=========================================================

Também regista as estatísticas individuais.
*/

function darPonto(
    equipa,
    jogador,
    tipo
) {

    if (equipa === "jogador") {

        jogadorPontos++;

    } else {

        adversarioPontos++;
    }


    /*
    Estatística individual
    */

    if (jogador) {

        let estatisticas =
            estatisticasJogadores[jogador.id];


        /*
        Caso as estatísticas ainda não
        tenham sido criadas.
        */

        if (!estatisticas) {

            estatisticasJogadores[jogador.id] = {

                nome: jogador.nome,

                pontos: 0,

                ataques: 0,

                aces: 0,

                assistencias: 0,

                errosAtaque: 0,

                errosServico: 0,

                defesas: 0
            };

            estatisticas =
                estatisticasJogadores[jogador.id];
        }


        if (tipo === "ACE") {
            estatisticas.pontos++;
            estatisticas.aces++;
        }


        if (tipo === "ATAQUE") {
            estatisticas.pontos++;
            estatisticas.ataques++;
        }
        
        if (tipo === "ASSISTENCIA") {

            estatisticas.assistencias++;
        }
    }


    console.log(
        "PONTO: " +
        equipa +
        " - " +
        tipo
    );
}


/*
=========================================================
JOGAR RALLY
=========================================================

Estrutura:

SERVIÇO
↓
1º TOQUE - RECEÇÃO
↓
2º TOQUE - LEVANTAMENTO
↓
3º TOQUE - ATAQUE
↓
resultado
*/

function jogarRally() {

    /*
    Verificar se o jogo terminou
    */

    if (verificarFimDeJogo()) {

        return;
    }


    /*
    Verificar se o set terminou
    */

    if (verificarFimDeSet()) {

        return;
    }

    let equipaQueRecebe;

    Escolher aleatoriamente quem serve
    */

        equipaQueServe =
            "jogador";

        equipaQueRecebe =
            "adversario";


        servidor = escolherServidor(jogadoresEscolhidos);


        receptor = escolherReceptor(jogadoresAdversarios);

    } else {

        equipaQueServe =
            "adversario";

        equipaQueRecebe =
            "jogador";


        servidor = escolherServidor(jogadoresAdversarios);


        receptor = escolherReceptor(jogadoresEscolhidos);
    }


    console.log(
        "=============================="
    );

    console.log(
        "NOVO RALLY"
    );

    console.log(
        servidor.nome +
        " está a servir."
    );

    console.log(
        receptor.nome +
        " vai receber."
    );


    /*
    =====================================================
    SERVIÇO
    =====================================================
    */

    let resultadoServico =
        resolverServico(
            servidor,
            receptor
        );


    /*
    ACE
    */

    if (
        resultadoServico.tipo === "ACE"
    ) {

        darPonto(
            equipaQueServe,
            servidor,
            "ACE"
        );


        console.log(
            servidor.nome +
            " fez ACE!"
        );


        atualizarPlacar();

        return;
    }


    /*
    =====================================================
    DEFINIR EQUIPA QUE RECEBEU
    =====================================================
    */

    let equipaAtacante;

    let equipaDefensora;


    if (
        equipaQueRecebe === "jogador"
    ) {

        equipaAtacante =
            jogadoresEscolhidos;

        equipaDefensora =
            jogadoresAdversarios;

    } else {

        equipaAtacante =
            jogadoresAdversarios;

        equipaDefensora =
            jogadoresEscolhidos;
    }


    /*
    =====================================================
    1º TOQUE
    RECEÇÃO
    =====================================================

    O jogador já foi escolhido:

    receptor
    */


    console.log(
        "1º toque: " +
        receptor.nome +
        " fez a receção."
    );


    /*
    =====================================================
    2º TOQUE
    LEVANTAMENTO
    =====================================================
    */

    let levantador =
        escolherLevantador(
            equipaAtacante,
            receptor
        );


    let resultadoLevantamento =
        resolverLevantamento(
            levantador,
            resultadoServico
        );


    console.log(
        "2º toque: " +
        levantador.nome +
        " fez o levantamento."
    );


    /*
    =====================================================
    3º TOQUE
    ATAQUE
    =====================================================
    */

    let atacante =
        escolherAtacante(
            equipaAtacante,
            receptor,
            levantador
        );


    console.log(
        "3º toque: " +
        atacante.nome +
        " atacou."
    );


    let resultadoAtaque =
        resolverAtaque(
            atacante,
            equipaDefensora,
            resultadoLevantamento.bonusAtaque
        );


    /*
    =====================================================
    ATAQUE VENCEDOR
    =====================================================
    */

    if (
        resultadoAtaque.tipo === "ATAQUE"
    ) {

        darPonto(
            equipaQueRecebe,
            atacante,
            "ATAQUE"
        );


        console.log(
            atacante.nome +
            " marcou através de ataque!"
        );


        atualizarPlacar();

        return;
    }


    /*
    =====================================================
    RALLY CONTINUA
    =====================================================

    O ataque não matou a jogada.

    Agora a outra equipa ganha a bola
    e começa os seus próprios 3 toques.
    */

    continuarRally(
        equipaDefensora,
        equipaAtacante,

        equipaQueRecebe === "jogador"
            ? "adversario"
            : "jogador"
    );


    atualizarPlacar();
}


/*
=========================================================
CONTINUAR RALLY
=========================================================

A equipa que defendeu passa a atacar.

Também respeita:

1º toque → receção
2º toque → levantamento
3º toque → ataque
*/

function continuarRally(
    equipaQueDefendeu,
    equipaQueAtacou,
    nomeEquipaDefensora
) {

    console.log(
        "----- RALLY CONTINUA -----"
    );


    /*
    A equipa que acabou de defender
    passa a atacar.
    */

    let receptor =
        escolherReceptor(
            equipaQueDefendeu
        );


    /*
    1º TOQUE
    */

    console.log(
        "1º toque: " +
        receptor.nome +
        " fez a defesa."
    );


    /*
    2º TOQUE
    */

    let levantador =
        escolherLevantador(
            equipaQueDefendeu,
            receptor
        );


    let resultadoLevantamento =
        resolverLevantamento(
            levantador,
            {
                dificuldade: 0
            }
        );


    console.log(
        "2º toque: " +
        levantador.nome +
        " levantou."
    );


    /*
    3º TOQUE
    */

    let atacante =
        escolherAtacante(
            equipaQueDefendeu,
            receptor,
            levantador
        );


    console.log(
        "3º toque: " +
        atacante.nome +
        " atacou."
    );


    /*
    O ataque enfrenta a equipa
    que tinha atacado anteriormente.
    */

    let resultadoAtaque =
        resolverAtaque(
            atacante,
            equipaQueAtacou,
            resultadoLevantamento.bonusAtaque
        );


    /*
    ATAQUE VENCEDOR
    */

    if (
        resultadoAtaque.tipo === "ATAQUE"
    ) {

        darPonto(
            nomeEquipaDefensora,
            atacante,
            "ATAQUE"
        );


        console.log(
            atacante.nome +
            " marcou no rally!"
        );

        return;
    }


    /*
    Se a bola continuar, vamos fazer
    mais uma troca de ataques.

    Para evitar um loop infinito,
    existe um limite de rallies internos.
    */

    continuarRallyLongo(
        equipaQueDefendeu,
        equipaQueAtacou,
        nomeEquipaDefensora,
        1
    );
}


/*
=========================================================
RALLY LONGO
=========================================================

Permite que a jogada continue várias vezes.

O parâmetro numeroTrocas impede que o programa
fique preso num loop infinito.
*/

function continuarRallyLongo(
    equipaA,
    equipaB,
    equipaAtual,
    numeroTrocas) {

    const MAX_TROCAS = 5;


    /*
    Se ultrapassar o limite,
    usamos o físico + sorte para determinar
    quem consegue manter a jogada.
    */

    if (
        numeroTrocas > MAX_TROCAS
    ) {

        let mediaA =
            calcularMediaFisico(
                equipaA
            );

        let mediaB =
            calcularMediaFisico(
                equipaB
            );


        let resultadoA =
            mediaA + rolagem();

        let resultadoB =
            mediaB + rolagem();


        if (
            resultadoA >= resultadoB
        ) {

            let jogador =
                escolherAtacanteAleatorio(
                    equipaA
                );


            darPonto(
                equipaAtual,
                jogador,
                "ATAQUE"
            );

        } else {

            let outraEquipa =
                equipaAtual === "jogador"
                    ? "adversario"
                    : "jogador";


            let jogador =
                escolherAtacanteAleatorio(
                    equipaB
                );


            darPonto(
                outraEquipa,
                jogador,"ATAQUE");
        }


        return;
    }


    /*
    Trocar as equipas
    */

    let novaEquipaAtacante =
        equipaA;

    let novaEquipaDefensora =
        equipaB;


    let nomeEquipaAtacante =
        equipaAtual;


    /*
    Receção
    */

    let receptor =
        escolherReceptor(
            novaEquipaAtacante
        );


    /*
    Levantamento
    */

    let levantador =
        escolherLevantador(
            novaEquipaAtacante,
            receptor
        );


    let resultadoLevantamento =
        resolverLevantamento(
            levantador,
            {
                dificuldade: 0
            }
        );


    /*
    Ataque
    */

    let atacante =
        escolherAtacante(
            novaEquipaAtacante,
            receptor,
            levantador
        );


    let resultadoAtaque =
        resolverAtaque(
            atacante,
            novaEquipaDefensora,
            resultadoLevantamento.bonusAtaque
        );


    /*
    ATAQUE VENCEDOR
    */

    if (resultadoAtaque.tipo === "ATAQUE") {

        darPonto(nomeEquipaAtacante,atacante,"ATAQUE");
        darPonto(nomeEquipaAtacante,levantador,"ASSISTENCIA");
        return;
    }


    /*
    Mais uma troca.
    */

    let proximaEquipa =
        nomeEquipaAtacante === "jogador"
            ? "adversario"
            : "jogador";


    continuarRallyLongo(novaEquipaDefensora,novaEquipaAtacante,proximaEquipa,numeroTrocas + 1);
}


/*
=========================================================
CALCULAR MÉDIA DE FÍSICO
=========================================================
*/

function calcularMediaFisico(jogadores) {

    if (
        jogadores.length === 0
    ) {

        return 0;
    }


    let total = 0;


    jogadores.forEach(
        jogador => {

            total += jogador.fisico;
        }
    );


    return total / jogadores.length;
}


/*
=========================================================
ESCOLHER ATACANTE ALEATÓRIO
=========================================================
*/

function escolherAtacanteAleatorio(
    jogadores
) {

    let indice =
        Math.floor(
            Math.random() *
            jogadores.length
        );


    return jogadores[indice];
}


/*
=========================================================
ATUALIZAR PLACAR
=========================================================
*/

function atualizarPlacar() {

    let elementoEquipa =
        document.getElementById(
            "team-score"
        );

    let elementoAdversario =
        document.getElementById(
            "opponent-score"
        );


    if (elementoEquipa) {

        elementoEquipa.textContent =
            jogadorPontos;
    }


    if (elementoAdversario) {

        elementoAdversario.textContent =
            adversarioPontos;
    }


    /*
    Verificar se o set terminou
    */

    verificarFimDeSet();
}


/*
=========================================================
VERIFICAR FIM DO SET
=========================================================

15 pontos e diferença de pelo menos 2.
*/

function verificarFimDeSet() {

    let setTerminou = false;


    if (jogadorPontos >= PONTOS_PARA_VENCER && jogadorPontos - adversarioPontos >= 2) {
        jogadorSets++;
        setTerminou = true;
        console.log(
            "BARREIRO GANHOU O SET!"
        );

    }
    else if (adversarioPontos >= PONTOS_PARA_VENCER && adversarioPontos - jogadorPontos >= 2) {
        adversarioSets++;
        setTerminou = true;
        

        console.log(
            equipaAdversaria +
            " GANHOU O SET!"
        );
    }


    if (setTerminou) {

        console.log(
            "Sets: " +
            jogadorSets +
            " - " +
            adversarioSets
        );


        jogadorPontos = 0;

        adversarioPontos = 0;


        atualizarPlacarSemVerificarSet();
    }

        if (jogadores1set >= 0){
            jogadores1set = jogadorPontos;
        }
        else if (jogadores2set >= 0){
            jogadores2set = jogadorPontos;

        }
        else{
            jogadores3set = jogadorPontos;
        }
        
        if (adversario1set < 0){
            adversario1set = adversarioPontos;
        }
        else if (adversario2set < 0){
            adversario2set = adversarioPontos;

        }
        else{
            adversario3set = adversarioPontos;
        }


    return setTerminou;
}


/*
=========================================================
ATUALIZAR PLACAR SEM VOLTAR A VERIFICAR O SET
=========================================================
*/

function atualizarPlacarSemVerificarSet() {

    let elementoEquipa =
        document.getElementById(
            "team-score"
        );

    let elementoAdversario =
        document.getElementById(
            "opponent-score"
        );


    if (elementoEquipa) {

        elementoEquipa.textContent =
            jogadorPontos;
    }


    if (elementoAdversario) {

        elementoAdversario.textContent =
            adversarioPontos;
    }
}


/*
=========================================================
VERIFICAR FIM DO JOGO
=========================================================

Primeiro a 3 sets ganha.
*/

function verificarFimDeJogo() {

    if (
        jogadorSets >= 3
    ) {

        console.log(
            "BARREIRO GANHOU O JOGO!"
        );

        return true;
    }


    if (
        adversarioSets >= 3
    ) {

        console.log(
            equipaAdversaria +
            " GANHOU O JOGO!"
        );

        return true;
    }


    return false;
}


/*

INICIALIZAR ESTATÍSTICAS
=========================================================
*/

function inicializarEstatisticas(jogadores) {

    jogadores.forEach(
        jogador => {

            estatisticasJogadores[jogador.id] = {

                nome: jogador.nome,

                pontos: 0,

                ataques: 0,

                aces: 0,

                assistencias: 0,

                errosAtaque: 0,

                errosServico: 0,

                defesas: 0
            };
        }
    );
}
