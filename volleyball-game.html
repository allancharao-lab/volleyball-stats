<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volleyball Game</title>

    <style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background: gray;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   CAMPO
========================= */

.field {

    position: relative;

    width: 500px;
    height: 300px;

    background: #d99a3d;

    border: 5px solid white;

    border-radius: 10px;

    box-shadow:
        0 0 0 4px #181818,
        0 20px 50px rgba(0, 0, 0, 0.7);

    overflow: visible;
}


/* =========================
   REDE
========================= */

.net {

    position: absolute;

    left: 50%;
    top: 0%;

    transform: translateX(-50%);

    width: 7px;
    height: 100%;

    background: white;

    box-shadow:
        0 0 8px rgba(0, 0, 0, 0.6);

    z-index: 5;
}


/* =========================
   LINHAS DE ATAQUE
========================= */

.attack-line-left {

    position: absolute;

    left: 25%;
    top: 0;

    width: 3px;
    height: 100%;

    background: rgba(255, 255, 255, 0.9);

    z-index: 1;
}


.attack-line-right {

    position: absolute;

    right: 25%;
    top: 0;

    width: 3px;
    height: 100%;

    background: rgba(255, 255, 255, 0.9);

    z-index: 1;
}


/* =========================
   ÁREA DOS JOGADORES
========================= */

.players {

    position: absolute;

    left: 5%;
    top: 10%;

    width: 40%;
    height: 80%;

    z-index: 10;
}


/* =========================
   JOGADORES
========================= */

.Player {

    position: absolute;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    background: linear-gradient(
        145deg,
        #292929,
        #111111
    );

    border: 2px solid #f5c542;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: white;

    font-size: 14px;

    font-weight: bold;

    text-transform: uppercase;

    box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.6);

    cursor: pointer;

    transition: 0.2s ease;
}


/* =========================
   NÚMERO DO JOGADOR
========================= */

.Player::before {

    content: attr(data-number);

    position: absolute;

    top: -7px;
    left: -7px;

    width: 19px;
    height: 19px;

    border-radius: 50%;

    background: #f5c542;

    color: #111;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 9px;

    font-weight: 900;

    border: 2px solid #111;
}


/* =========================
   HOVER
========================= */

.Player:hover {

    transform: scale(1.15);

    border-color: white;

    box-shadow:
        0 0 15px rgba(245, 197, 66, 0.7);
}


/* =========================
   GRELHA 3 × 2
=========================

   DE CIMA PARA BAIXO:

       5     4
       6     3
       1     2

   DE BAIXO PARA CIMA:

       1     2
       6     3
       5     4

========================= */


/* =========================
   LINHA DE CIMA
========================= */

.Player.pos-5 {

    left: 0%;
    top: 0%;
}


.Player.pos-4 {

    left: 80%;
    top: 0%;
}


/* =========================
   LINHA DO MEIO
========================= */

.Player.pos-6 {

    left: 0%;
    top: 40%;
}


.Player.pos-3 {

    left: 80%;
    top: 40%;
}


/* =========================
   LINHA DE BAIXO
========================= */

.Player.pos-1 {

    left: 0%;
    top: 80%;
}


.Player.pos-2 {

    left: 80%;
    top: 80%;
}


/* =========================
   LIBERO
   FORA DA QUADRA
========================= */

.Player.libero {

    left: 40%;
    top: 105%;

    width: 48px;
    height: 48px;

    background: #f5c542;

    color: #111;

    border-color: #111;
}


.Player.libero::before {

    background: #111;

    color: #f5c542;

    border-color: #f5c542;
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 1050px) {

    .field {

        width: 90vw;
        height: 55vw;

        min-height: 450px;
    }


    .players {

        left: 4%;
        width: 42%;
    }


    .Player {

        width: 48px;
        height: 48px;

        font-size: 7px;
    }


    .Player.libero {

        width: 42px;
        height: 42px;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .field {

        width: 95vw;
        height: 500px;
    }


    .players {

        left: 4%;

        top: 18%;

        width: 42%;
        height: 65%;
    }


    .Player {

        width: 40px;
        height: 40px;

        font-size: 6px;
    }


    .Player::before {

        width: 15px;
        height: 15px;

        font-size: 7px;

        top: -5px;
        left: -5px;
    }


    .Player.libero {

        width: 35px;
        height: 35px;
    }
}
    </style>

</head>


<body>


    <!-- =========================
         CAMPO
    ========================= -->

    <div class="field">


        <!-- Rede -->

        <div class="net"></div>
        <div class="attack-line-left"></div>
        <div class="attack-line-right"></div>
        <div class="players">
            <!-- Frente -->

            <div class="Player pos-4" data-number="4">
                OP
            </div>


            <div class="Player pos-3" data-number="3">
                MB
            </div>


            <div class="Player pos-2" data-number="2">
                OH
            </div>


            <!-- Trás -->

            <div class="Player pos-5" data-number="5">
                OH
            </div>


            <div class="Player pos-1" data-number="1">
                S
            </div>


            <div class="Player pos-6" data-number="6">
                MB
            </div>


            <!-- Líbero -->

            <div class="Player libero" data-number="L">
                L
            </div>


        </div>

    </div>


    <script>

    </script>


</body>
</html>
