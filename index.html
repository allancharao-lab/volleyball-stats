<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volleyball Game</title>

    <style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

    width: 100vw;
    height: 100vh;
    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: gray;

    display: flex;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden;
}


/* =========================
   CAMPO
========================= */

.field {

    position: relative;

    width: 700px;
    height: 400px;

    margin-right: -245px;

    background: #d99a3d;

    border: 5px solid white;

    border-radius: 10px;

    box-shadow:
        0 0 0 4px #181818,
        0 20px 50px rgba(0, 0, 0, 0.7);

    overflow: visible;
}


/* =========================
   REDE
========================= */

.net {

    position: absolute;

    left: 50%;
    top: 0%;

    transform: translateX(-50%);

    width: 7px;
    height: 100%;

    background: white;

    box-shadow:
        0 0 8px rgba(0, 0, 0, 0.6);

    z-index: 5;
}


/* =========================
   LINHAS DE ATAQUE
========================= */

.attack-line-left {

    position: absolute;

    left: 15%;
    top: 0;

    width: 3px;
    height: 100%;

    background: rgba(255, 255, 255, 0.9);

    z-index: 1;
}


.attack-line-right {

    position: absolute;

    right: 25%;
    top: 0;

    width: 3px;
    height: 100%;

    background: rgba(255, 255, 255, 0.9);

    z-index: 1;
}


/* =========================
   ÁREA DOS JOGADORES
========================= */

.players {

    position: absolute;

    width: 40%;
    height: 80%;

    z-index: 10;
}


/* =========================
   JOGADORES
========================= */

.Player {

    position: absolute;

    width: 77px;
    height: 77px;

    border-radius: 50%;

    background: linear-gradient(
        145deg,
        #292929,
        #111111
    );

    border: 2px solid #f5c542;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: white;

    font-size: 14px;

    font-weight: bold;

    text-transform: uppercase;

    box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.6);

    cursor: pointer;

    transition: 0.2s ease;
}


/* =========================
   NÚMERO DO JOGADOR
========================= */

.Player::before {

    content: attr(data-number);

    position: absolute;

    top: -7px;
    left: -7px;

    width: 25px;
    height: 25px;

    border-radius: 50%;

    background: #f5c542;

    color: #111;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 9px;

    font-weight: 900;

    border: 2px solid #111;
}


/* =========================
   HOVER
========================= */

.Player:hover {

    transform: scale(1.15);

    border-color: white;

    box-shadow:
        0 0 15px rgba(245, 197, 66, 0.7);
}

.Player.pos-1 {

    left: 30%;
    top: -15%;
}


.Player.pos-2 {

    left: -20%;
    top: 50%;
}

.Player.pos-3 {

    left: 30%;
    top: 115%;
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 1050px) {

    .field {

        width: 90vw;
        height: 55vw;

        min-height: 450px;
    }


    .players {

        left: 4%;
        width: 42%;
    }


    .Player {

        width: 48px;
        height: 48px;

        font-size: 7px;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .field {

        width: 95vw;
        height: 500px;
    }


    .players {

        left: 4%;

        top: 18%;

        width: 42%;
        height: 65%;
    }


    .Player {

        width: 40px;
        height: 40px;

        font-size: 6px;
    }


    .Player::before {

        width: 15px;
        height: 15px;

        font-size: 7px;

        top: -5px;
        left: -5px;
    }


    .Player.libero {

        width: 35px;
        height: 35px;
    }
}

/* =========================
   SORTEIO DA EQUIPA
========================= */

        .team-selection {

            position: absolute;

            left: 40px;
            top: 50%;

            transform: translateY(-50%);

            width: 220px;
            min-height: 250px;
            height: auto;

            background: #181818;

            border: 3px solid #f5c542;

            border-radius: 10px;

            color: white;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.5);
        }


        .team-selection h2 {

            font-size: 18px;

            margin-bottom: 15px;
        }


        .team-name {

            font-size: 24px;

            font-weight: bold;

            color: #f5c542;
        }

        .character-disabled {

            opacity: 0.35;

            cursor: not-allowed;

            filter: grayscale(100%);
        }

        #team-players {
            width: 100%;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            max-height: 420px;
            overflow-y: auto;
            padding: 5px 0;
        }

        .character {
            width: 95%;
            min-height: 82px;
            padding: 10px 14px;
            background: #292929;
            border: 2px solid #f5c542;
            border-radius: 8px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .character:hover {
            background: #3a3a3a;
            transform: scale(1.03);
        }

        .character-name {
            font-size: 14px;
            font-weight: bold;
        }

        .character-positions {
            margin-top: 3px;
            font-size: 12px;
            color: #cccccc;
        }

        .character-overall {
            margin-top: 3px;
            font-size: 13px;
            color: #f5c542;
            font-weight: bold;
        }

        .character-disabled {
            opacity: 0.35;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .character-disabled:hover {
            transform: none;
        }

        .position-overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.65);

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 1000;
        }

        .position-popup {
            width: 260px;

            padding: 25px;

            background: #292929;

            border: 2px solid #f5c542;

            border-radius: 10px;

            text-align: center;

            color: white;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .position-popup h3 {
            margin-bottom: 8px;
        }

        .position-popup p {
            margin-bottom: 20px;

            font-weight: bold;
        }

        .position-popup button {
            width: 100%;

            padding: 10px;

            margin-top: 7px;

            border: none;

            border-radius: 6px;

            background: #f5c542;

            color: #111;

            font-weight: bold;

            cursor: pointer;
        }

        .position-popup button:hover {
            background: #ffd966;
        }

        .position-popup .cancelar {
            background: #555;
            color: white;
        }

        .position-popup .cancelar:hover {
            background: #666;
        }
    </style>

</head>


<body>

     <div class="team-selection">

        <h2>Equipa sorteada</h2>

        <div class="team-name" id="team-name">
            ?
        </div>

        <button id="start-game">
            Começar jogo
        </button>

        <div id="team-players"></div>

    </div>

    <div class="field">

        <div class="net"></div>
        <div class="attack-line-left"></div>
        <div class="attack-line-right"></div>
        <div class="players">

            <div class="Player pos-1" data-number="1" id="player-1">
                LW
            </div>


            <div class="Player pos-2" data-number="2" id="player-2">
                CM
            </div>


            <div class="Player pos-3" data-number="3" id="player-3">
                RW
            </div>


        </div>

    </div>


    <script>
        const equipes = ["Barreiro", "Setúbal", "Corroios"];

        let personagens = [];
        let jogadoresEscolhidos = [];

        const posicoes = ["LW", "CM", "RW"];
        let posicoesOcupadas = [];


        // ======================================================
        // CARREGAR JOGADORES DO TXT
        // ======================================================

        async function carregarPersonagens() {

            try {

                const resposta = await fetch("players.txt");

                const texto = await resposta.text();

                const linhas = texto.split("\n");

                personagens = [];

                linhas.forEach(linha => {

                    if (linha.trim() === "") {
                        return;
                    }

                    const dados = linha.trim().split(";");

                    personagens.push({

                        id: dados[0],

                        nome: dados[1],

                        ataque: Number(dados[2]),

                        servico: Number(dados[3]),

                        passe: Number(dados[4]),

                        iq: Number(dados[5]),

                        defesa: Number(dados[6]),

                        fisico: Number(dados[7]),

                        overall: Number(dados[8]),

                        posicao1: dados[9],

                        posicao2: dados[10],

                        time: dados[11]

                    });

                });

                console.log("Jogadores carregados:", personagens);

                // Começar o jogo
                sortearNovaEquipe();

            } catch (erro) {

                console.error("Erro ao carregar players.txt:", erro);

            }
        }


        // ======================================================
        // SORTEAR EQUIPA
        // ======================================================

        function sortearEquipe() {

            const indice = Math.floor(Math.random() * equipes.length);

            return equipes[indice];
        }


        // ======================================================
        // SORTEAR NOVA EQUIPA
        // ======================================================

        function sortearNovaEquipe() {

            let novaEquipe;

            do {

                novaEquipe = sortearEquipe();

            } while (
                novaEquipe ===
                document.getElementById("team-name").textContent
            );

            mostrarEquipe(novaEquipe);

            mostrarJogadoresDaEquipe(novaEquipe);
        }


        // ======================================================
        // MOSTRAR NOME DA EQUIPA
        // ======================================================

        function mostrarEquipe(equipe) {

            const teamName = document.getElementById("team-name");

            if (teamName) {

                teamName.textContent = equipe;

            }

            console.log("Equipa sorteada:", equipe);
        }


        // ======================================================
        // VERIFICAR SE O JOGADOR PODE JOGAR NA POSIÇÃO
        // ======================================================

        function podeJogarNaPosicao(jogador, posicao) {

            const posicao1 = jogador.posicao1
                .trim()
                .toUpperCase();

            const posicao2 = jogador.posicao2
                .trim()
                .toUpperCase();

            // Verifica as duas posições
            if (posicao1 === posicao) {
                return true;
            }

            if (posicao2 === posicao) {
                return true;
            }

            return false;
        }

        function jogadorJaEscolhido(jogador) {
            return jogadoresEscolhidos.some(
            jogadorEscolhido => jogadorEscolhido.id === jogador.id
            );
        }


        // ======================================================
        // VERIFICAR SE O JOGADOR JÁ FOI ESCOLHIDO
        // ======================================================
        function mostrarJogadoresDaEquipe(equipe) {

            const container = document.getElementById("team-players");

            if (!container) {
                console.error("Não foi encontrado o elemento #team-players");
                return;
            }

            container.innerHTML = "";

            const jogadoresDaEquipe = personagens.filter(jogador => {

                if (!jogador.time) {
                    return false;
                }

                return (
                    jogador.time.trim().toLowerCase() ===
                    equipe.trim().toLowerCase()
                );
            });

            console.log("Equipa sorteada:", equipe);
            console.log("Jogadores encontrados:", jogadoresDaEquipe);

            if (jogadoresDaEquipe.length === 0) {

                container.innerHTML =
                    "<div>Nenhum jogador encontrado.</div>";

                return;
            }

            jogadoresDaEquipe.forEach(jogador => {

                const jogadorDiv = document.createElement("div");

                jogadorDiv.classList.add("character");

                // ==========================================
                // NOME
                // ==========================================

                const nome = document.createElement("div");

                nome.classList.add("character-name");

                nome.textContent = jogador.nome;


                // ==========================================
                // POSIÇÕES
                // ==========================================

                const posicoesJogador = document.createElement("div");

                posicoesJogador.classList.add(
                    "character-positions"
                );

                let textoPosicoes = jogador.posicao1;

                if (
                    jogador.posicao2 &&
                    jogador.posicao2.toLowerCase() !== "none"
                ) {

                    textoPosicoes +=
                        " / " + jogador.posicao2;

                }

                posicoesJogador.textContent = textoPosicoes;


                // ==========================================
                // OVERALL
                // ==========================================

                const overall = document.createElement("div");

                overall.classList.add(
                    "character-overall"
                );

                overall.textContent =
                    "OVR " + jogador.overall;


                // ==========================================
                // ADICIONAR ELEMENTOS
                // ==========================================

                jogadorDiv.appendChild(nome);

                jogadorDiv.appendChild(
                    posicoesJogador
                );

                jogadorDiv.appendChild(overall);


                // ==========================================
                // VERIFICAR SE JÁ FOI ESCOLHIDO
                // ==========================================

                const jaEscolhido =
                    jogadorJaEscolhido(jogador);


                // ==========================================
                // VERIFICAR SE PODE JOGAR
                // EM ALGUMA POSIÇÃO RESTANTE
                // ==========================================

                const podeJogarEmAlgumaPosicao =
                    posicoes.some(posicao => {

                        // A posição já está ocupada
                        if (
                            posicoesOcupadas.includes(posicao)
                        ) {
                            return false;
                        }

                        // O jogador pode jogar nessa posição
                        return podeJogarNaPosicao(
                            jogador,
                            posicao
                        );
                    });


                // ==========================================
                // DESATIVAR
                // ==========================================

                if (
                    jaEscolhido ||
                    !podeJogarEmAlgumaPosicao
                ) {

                    jogadorDiv.classList.add(
                        "character-disabled"
                    );

                    jogadorDiv.style.cursor =
                        "not-allowed";

                } else {

                    // ======================================
                    // CLICAR NO JOGADOR
                    // ======================================

                    jogadorDiv.addEventListener(
                        "click",
                        function () {

                            escolherPosicaoDoJogador(
                                jogador
                            );

                        }
                    );
                }


                container.appendChild(
                    jogadorDiv
                );

            });
        }

        // ======================================================
        // ESCOLHER JOGADOR
        // ======================================================
        function escolherJogador(jogador, posicaoEscolhida) {

            // Verificar se o jogador pode jogar nessa posição
            if (!podeJogarNaPosicao(jogador, posicaoEscolhida)) {
                return;
            }

            // Verificar se o jogador já foi escolhido
            if (jogadorJaEscolhido(jogador)) {
                return;
            }

            // Verificar se a posição já está ocupada
            if (posicoesOcupadas.includes(posicaoEscolhida)) {
                return;
            }

            console.log("Jogador escolhido:", jogador.nome);
            console.log("Posição escolhida:", posicaoEscolhida);

            // Guardar jogador + posição escolhida
            jogadoresEscolhidos.push({
                ...jogador,
                posicaoEscolhida: posicaoEscolhida
            });

            // Marcar posição como ocupada
            posicoesOcupadas.push(posicaoEscolhida);

            // Descobrir qual é o espaço do campo correspondente à posição
            const indiceCampo = posicoes.indexOf(posicaoEscolhida);

            // Colocar jogador no campo
            colocarJogadorNoCampo(
                jogador,
                indiceCampo,
                posicaoEscolhida
            );

            // Verificar se já temos os 3 jogadores
            if (posicoesOcupadas.length >= posicoes.length) {

                terminarEquipe();

                return;
            }

            // Sortear nova equipa
            sortearNovaEquipe();
        }


        // ======================================================
        // COLOCAR JOGADOR NO CAMPO
        // ======================================================

        function colocarJogadorNoCampo(jogador,posicaoCampo,posicaoEscolhida) {

            const jogadorCampo =
                document.getElementById(
                    "player-" + (posicaoCampo + 1)
                );

            if (!jogadorCampo) {

                console.error(
                    "Não foi encontrado player-" +
                    (posicaoCampo + 1)
                );

                return;
            }

            jogadorCampo.textContent =
                jogador.nome;

            jogadorCampo.dataset.playerId =
                jogador.id;

            jogadorCampo.dataset.position =
                posicaoEscolhida;

            jogadorCampo.dataset.number =
                posicaoCampo + 1;

            jogadorCampo.classList.add(
                "player-selected"
            );

            console.log(
                jogador.nome +
                " colocado em " +
                posicaoEscolhida
            );
        }
            function escolherPosicaoDoJogador(jogador) {

                const posicoesJogador = [];

                // ==========================================
                // POSIÇÃO 1
                // ==========================================

                if (
                    jogador.posicao1 &&
                    jogador.posicao1.toLowerCase() !== "none"
                ) {

                    const posicao =
                        jogador.posicao1.toUpperCase();

                    if (!posicoesOcupadas.includes(posicao)) {

                        posicoesJogador.push(posicao);

                    }
                }


                // ==========================================
                // POSIÇÃO 2
                // ==========================================

                if (
                    jogador.posicao2 &&
                    jogador.posicao2.toLowerCase() !== "none"
                ) {

                    const posicao =
                        jogador.posicao2.toUpperCase();

                    if (!posicoesOcupadas.includes(posicao)) {

                        posicoesJogador.push(posicao);

                    }
                }


                // ==========================================
                // NENHUMA POSIÇÃO DISPONÍVEL
                // ==========================================

                if (posicoesJogador.length === 0) {
                    return;
                }


                // ==========================================
                // APENAS UMA POSIÇÃO
                // ==========================================

                if (posicoesJogador.length === 1) {

                    escolherJogador(
                        jogador,
                        posicoesJogador[0]
                    );

                    return;
                }


                // ==========================================
                // CRIAR OVERLAY
                // ==========================================

                const overlay =
                    document.createElement("div");

                overlay.classList.add(
                    "position-overlay"
                );


                // ==========================================
                // POPUP
                // ==========================================

                const popup =
                    document.createElement("div");

                popup.classList.add(
                    "position-popup"
                );


                // ==========================================
                // TÍTULO
                // ==========================================

                const titulo =
                    document.createElement("h3");

                titulo.textContent =
                    "Escolher posição";


                // ==========================================
                // NOME
                // ==========================================

                const nome =
                    document.createElement("p");

                nome.textContent =
                    jogador.nome;


                popup.appendChild(titulo);

                popup.appendChild(nome);


                // ==========================================
                // BOTÕES DAS POSIÇÕES
                // ==========================================

                posicoesJogador.forEach(posicao => {

                    const botao =
                        document.createElement("button");

                    botao.textContent =
                        posicao;


                    botao.addEventListener(
                        "click",
                        function () {

                            escolherJogador(
                                jogador,
                                posicao
                            );

                            overlay.remove();

                        }
                    );


                    popup.appendChild(botao);

                });


                // ==========================================
                // CANCELAR
                // ==========================================

                const cancelar =
                    document.createElement("button");

                cancelar.textContent =
                    "Cancelar";

                cancelar.classList.add(
                    "cancelar"
                );


                cancelar.addEventListener(
                    "click",
                    function () {

                        overlay.remove();

                    }
                );


                popup.appendChild(
                    cancelar
                );


                overlay.appendChild(
                    popup
                );


                document.body.appendChild(
                    overlay
                );
            }


        // ======================================================
        // TERMINAR EQUIPA
        // ======================================================

        function terminarEquipe() {

            console.log(
                "=============================="
            );

            console.log(
                "EQUIPA COMPLETA!"
            );

            console.log(
                "=============================="
            );


            jogadoresEscolhidos.forEach(jogador => {

                console.log(
                    jogador.posicaoEscolhida +
                    ": " +
                    jogador.nome
                );

            });


            const teamName =
                document.getElementById(
                    "team-name"
                );

            if (teamName) {

                teamName.textContent =
                    "EQUIPA COMPLETA";

            }


            const container =
                document.getElementById(
                    "team-players"
                );

            if (container) {

                container.innerHTML =
                    "<div class='team-complete'>" +
                    "Equipa completa!" +
                    "</div>";

            }
        }

        // ======================================================
        // INICIAR JOGO
        // ======================================================

        
        document.getElementById("start-game").addEventListener("click", function () {

            carregarPersonagens();

            this.style.display = "none";

        });
    </script>


</body>
</html>
