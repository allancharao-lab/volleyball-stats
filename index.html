<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icone.png">
    <title>PnecballA0</title>

    <style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

    width: 100vw;
    height: 100vh;
    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: gray;

    display: flex;
    justify-content: flex-end;
    align-items: center;
    overflow: hidden;
}


/* =========================
   CAMPO
========================= */

.field {

    position: relative;

    width: 700px;
    height: 400px;

    margin-right: -245px;

    background: #d99a3d;

    border: 5px solid white;

    border-radius: 10px;

    box-shadow:
        0 0 0 4px #181818,
        0 20px 50px rgba(0, 0, 0, 0.7);

    overflow: visible;
}


/* =========================
   REDE
========================= */

.net {

    position: absolute;

    left: 50%;
    top: 0%;

    transform: translateX(-50%);

    width: 7px;
    height: 100%;

    background: white;

    box-shadow:
        0 0 8px rgba(0, 0, 0, 0.6);

    z-index: 5;
}


/* =========================
   LINHAS DE ATAQUE
========================= */

.attack-line-left {

    position: absolute;

    left: 15%;
    top: 0;

    width: 3px;
    height: 100%;

    background: rgba(255, 255, 255, 0.9);

    z-index: 1;
}


.attack-line-right {

    position: absolute;

    right: 25%;
    top: 0;

    width: 3px;
    height: 100%;

    background: rgba(255, 255, 255, 0.9);

    z-index: 1;
}


/* =========================
   ÁREA DOS JOGADORES
========================= */

.players {

    position: absolute;

    width: 40%;
    height: 80%;

    z-index: 10;
}


/* =========================
   JOGADORES
========================= */

.Player {
    position: absolute;
    width: 77px;
    height: 77px;
    border-radius: 50%;
    background: linear-gradient(
        145deg,
        #292929,
        #111111
    );
    border: 2px solid #f5c542;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.6);
    cursor: pointer;
    transition: 0.2s ease;
}


/* =========================
   NÚMERO DO JOGADOR
========================= */

.Player::before {
    content: attr(data-number);
    position: absolute;
    top: -7px;
    left: -7px;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #f5c542;
    color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 9px;
    font-weight: 900;
    border: 2px solid #111;
}


/* =========================
   HOVER
========================= */

.Player:hover {
    transform: scale(1.15);
    border-color: white;
    box-shadow:
        0 0 15px rgba(245, 197, 66, 0.7);
}

.Player.pos-1 {

    left: 30%;
    top: -15%;
}


.Player.pos-2 {

    left: -20%;
    top: 50%;
}

.Player.pos-3 {

    left: 30%;
    top: 115%;
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 1050px) {

    .field {

        width: 90vw;
        height: 55vw;

        min-height: 450px;
    }


    .players {

        left: 4%;
        width: 42%;
    }


    .Player {

        width: 48px;
        height: 48px;

        font-size: 7px;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .field {
        width: 95vw;
        height: 500px;
    }


    .players {
        left: 4%;
        top: 18%;
        width: 42%;
        height: 65%;
    }


    .Player {
        width: 40px;
        height: 40px;
        font-size: 4px;
    }


    .Player::before {
        width: 15px;
        height: 15px;
        font-size: 4px;
        top: -5px;
        left: -5px;
    }

}

        .texto-dourado {
            font-family: 'Arial', sans-serif;

            background: linear-gradient(45deg, #b38728, #fbf5b7, #bf953f, #fcf6ba, #b38728);

            /* Aplica o gradiente apenas ao texto */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            /* Aplica a animação */
            animation: brilhaOuro 6s linear infinite;

            /* Cria o movimento do brilho dourado */

            0% {
                background-position: 0% 50%;

            50% {

                /* =========================

<body>

    <div class="team-selection">

        <h2>Equipa sorteada</h2>

        <div class="team-name" id="team-name">
            ?
        </div>

        <button onclick="iniciarJogo()" id="start-game" class="comecarJogo">
            Começar jogo
        </button>

        <div id="team-players"></div>

    </div>


    <div class="team-info">
        <h2>Team info</h2>
        <h2 id="team-overall">Overall: ?</h2>
        <h2 id="team-leftWinger">LW: ?</h2>
        <h2 id="team-centralMidfilder">CM: ?</h2>
        <h2 id="team-rightWinger">RW: ?</h2>
    </div>

    <div class="field">
        <div class="net"></div>
        <div class="attack-line-left"></div>
        <div class="attack-line-right"></div>
        <div class="players">
            <div class="Player pos-1" data-number="1" id="player-1">
                LW
            </div>
            <div class="Player pos-2" data-number="2" id="player-2">
                CM
            </div>
            <div class="Player pos-3" data-number="3" id="player-3">
                RW
            </div>
        </div>
    </div>

    <script>
        const equipes = ["Barreiro 2026", "Setúbal 2025", "Corroios 2026", "Barreiro 2025", "Barreiro 2024"];

        let personagens = [];
        let jogadoresEscolhidos = [];

        const posicoes = ["LW", "CM", "RW"];
        let posicoesOcupadas = [];
        let overallSum = 0


        // ======================================================
        // CARREGAR JOGADORES DO TXT
        // ======================================================

        async function carregarPersonagens() {

            try {

                const resposta = await fetch("players.txt");

                const texto = await resposta.text();

                const linhas = texto.split("\n");

                personagens = [];

                linhas.forEach(linha => {

                    if (linha.trim() === "") {
                        return;
                    }

                    const dados = linha.trim().split(";");

                    personagens.push({

                        id: dados[0],

                        nome: dados[1],

                        ataque: Number(dados[2]),

                        servico: Number(dados[3]),

                        passe: Number(dados[4]),

                        iq: Number(dados[5]),

                        defesa: Number(dados[6]),

                        fisico: Number(dados[7]),

                        overall: Number(dados[8]),

                        posicao1: dados[9],

                        posicao2: dados[10],

                        time: dados[11]

                    });

                });

                console.log("Jogadores carregados:", personagens);

                // Começar o jogo
                sortearNovaEquipe();

            } catch (erro) {

                console.error("Erro ao carregar players.txt:", erro);

            }
        }


        // ======================================================
        // SORTEAR EQUIPA
        // ======================================================

        function sortearEquipe() {

            const indice = Math.floor(Math.random() * equipes.length);

            return equipes[indice];
        }


        // ======================================================
        // SORTEAR NOVA EQUIPA
        // ======================================================

        function sortearNovaEquipe() {

            let novaEquipe;

            do {

                novaEquipe = sortearEquipe();

            } while (
                novaEquipe ===
                document.getElementById("team-name").textContent
            );

            mostrarEquipe(novaEquipe);

            mostrarJogadoresDaEquipe(novaEquipe);
        }


        // ======================================================
        // MOSTRAR NOME DA EQUIPA
        // ======================================================

        function mostrarEquipe(equipe) {

            const teamName = document.getElementById("team-name");

            if (teamName) {

                teamName.textContent = equipe;

            }

            console.log("Equipa sorteada:", equipe);
        }


        // ======================================================
        // VERIFICAR SE O JOGADOR PODE JOGAR NA POSIÇÃO
        // ======================================================

        function podeJogarNaPosicao(jogador, posicao) {

            const posicao1 = jogador.posicao1
                .trim()
                .toUpperCase();

            const posicao2 = jogador.posicao2
                .trim()
                .toUpperCase();

            // Verifica as duas posições
            if (posicao1 === posicao) {
                return true;
            }

            if (posicao2 === posicao) {
                return true;
            }

            return false;
        }

        function jogadorJaEscolhido(jogador) {
            return jogadoresEscolhidos.some(jogadorEscolhido => jogadorEscolhido.equipe === jogador.equipe && jogadorEscolhido.nome  === jogador.nome);
        }


        // ======================================================
        // VERIFICAR SE O JOGADOR JÁ FOI ESCOLHIDO
        // ======================================================
        function mostrarJogadoresDaEquipe(equipe) {

            const container = document.getElementById("team-players");

            if (!container) {
                console.error("Não foi encontrado o elemento #team-players");
                return;
            }

            container.innerHTML = "";

            const jogadoresDaEquipe = personagens.filter(jogador => {

                if (!jogador.time) {
                    return false;
                }

                return (
                    jogador.time.trim().toLowerCase() ===
                    equipe.trim().toLowerCase()
                );
            });

            console.log("Equipa sorteada:", equipe);
            console.log("Jogadores encontrados:", jogadoresDaEquipe);

            if (jogadoresDaEquipe.length === 0) {

                container.innerHTML =
                    "<div>Nenhum jogador encontrado.</div>";

                return;
            }

            jogadoresDaEquipe.forEach(jogador => {

                const jogadorDiv = document.createElement("div");

                jogadorDiv.classList.add("character");

                // ==========================================
                // NOME
                // ==========================================

                const nome = document.createElement("div");

                nome.classList.add("character-name");

                nome.textContent = jogador.nome;

                if (jogador.overall >= 90){
                nome.classList.add("texto-dourado");

                }


                // ==========================================
                // POSIÇÕES
                // ==========================================

                const posicoesJogador = document.createElement("div");

                posicoesJogador.classList.add(
                    "character-positions"
                );

                let textoPosicoes = jogador.posicao1;

                if (
                    jogador.posicao2 &&
                    jogador.posicao2.toLowerCase() !== "none"
                ) {

                    textoPosicoes +=
                        " / " + jogador.posicao2;

                }

                posicoesJogador.textContent = textoPosicoes;


                // ==========================================
                // OVERALL
                // ==========================================

                const overall = document.createElement("div");

                overall.classList.add(
                    "character-overall"
                );

                overall.textContent =
                    "OVR " + jogador.overall;


                // ==========================================
                // ADICIONAR ELEMENTOS
                // ==========================================

                jogadorDiv.appendChild(nome);

                jogadorDiv.appendChild(
                    posicoesJogador
                );

                jogadorDiv.appendChild(overall);


                // ==========================================
                // VERIFICAR SE JÁ FOI ESCOLHIDO
                // ==========================================

                const jaEscolhido =
                    jogadorJaEscolhido(jogador);


                // ==========================================
                // VERIFICAR SE PODE JOGAR
                // EM ALGUMA POSIÇÃO RESTANTE
                // ==========================================

                const podeJogarEmAlgumaPosicao =
                    posicoes.some(posicao => {

                        // A posição já está ocupada
                        if (
                            posicoesOcupadas.includes(posicao)
                        ) {
                            return false;
                        }

                        // O jogador pode jogar nessa posição
                        return podeJogarNaPosicao(
                            jogador,
                            posicao
                        );
                    });


                // ==========================================
                // DESATIVAR
                // ==========================================

                if (
                    jaEscolhido ||
                    !podeJogarEmAlgumaPosicao
                ) {

                    jogadorDiv.classList.add(
                        "character-disabled"
                    );

                    jogadorDiv.style.cursor =
                        "not-allowed";

                } else {

                    // ======================================
                    // CLICAR NO JOGADOR
                    // ======================================

                    jogadorDiv.addEventListener(
                        "click",
                        function () {

                            escolherPosicaoDoJogador(
                                jogador
                            );

                        }
                    );
                }


                container.appendChild(
                    jogadorDiv
                );

            });
        }

        // ======================================================
        // ESCOLHER JOGADOR
        // ======================================================
        function escolherJogador(jogador, posicaoEscolhida) {

            // Verificar se o jogador pode jogar nessa posição
            if (!podeJogarNaPosicao(jogador, posicaoEscolhida)) {
                return;
            }

            // Verificar se o jogador já foi escolhido
            if (jogadorJaEscolhido(jogador)) {
                return;
            }

            // Verificar se a posição já está ocupada
            if (posicoesOcupadas.includes(posicaoEscolhida)) {
                return;

/*
=========================================================
ROLAGEM DE SORTE
=========================================================

Retorna um valor entre -10 e +10.

Exemplo:

90 + rolagem()

pode resultar em:

80
81
...
90
...
100
*/

function rolagem() {

    return Math.floor(Math.random() * 21) - 10;
}


function escolherServidor(equipa) {

    const jogadores = equipa === "jogador"
        ? jogadoresEscolhidos
        : jogadoresAdversarios;

    const indice = equipa === "jogador"
        ? indiceServicoJogador
        : indiceServicoAdversario;

    const posicao = ordemServico[indice];

    const servidor = jogadores.find(
        jogador => jogador.posicaoEscolhida === posicao
    );

    if (!servidor) {
        console.error(
            "Não foi encontrado servidor.",
            "Equipa:", equipa,
            "Posição:", posicao,
            "Jogadores:", jogadores
        );
    }

    return servidor;
}


function atualizarServico(equipaVencedora) {
    // Se a equipa vencedora já estava a servir,
    // mantém o mesmo jogador.
    if (equipaVencedora === equipaQueServe) {
        return;
    }

    // A equipa que estava a receber recuperou o serviço.
    equipaQueServe = equipaVencedora;

    // Avança a rotação dessa equipa.
    if (equipaQueServe === "jogador") {
        indiceServicoJogador =
            (indiceServicoJogador + 1) % ordemServico.length;
    } else {
        indiceServicoAdversario =
            (indiceServicoAdversario + 1) % ordemServico.length;
    }
}

=========================================================

Escolhe 3 jogadores aleatoriamente da equipa

*/

async function construirEquipaAdversaria() {

    const resposta = await fetch("players.txt");

    const texto = await resposta.text();

    const linhas = texto.trim().split("\n");

    const jogadores = [];

    for (let i = 0; i < linhas.length; i++) {

        const dados = linhas[i].trim().split(";");

        if (dados.length < 12) {
            continue;
        }

        jogadores.push({
            id: dados[0],
            nome: dados[1],
            ataque: Number(dados[2]),
            servico: Number(dados[3]),
            passe: Number(dados[4]),
            iq: Number(dados[5]),
            defesa: Number(dados[6]),
            fisico: Number(dados[7]),
            overall: Number(dados[8]),
            posicao1: dados[9],
            posicao2: dados[10],
            time: dados[11]
        });
    }

    // Jogadores pertencentes à equipa adversária
    const jogadoresDaEquipa = jogadores.filter(
        jogador => jogador.time === equipaAdversaria
    );

    if (jogadoresDaEquipa.length < 3) {

        console.error(
            "A equipa " + equipaAdversaria +
            " não tem jogadores suficientes."
        );

        jogadoresAdversarios = [];

        return false;
    }

    // Baralhar jogadores
    jogadoresDaEquipa.sort(() => Math.random() - 0.5);

    // Escolher 3
    jogadoresAdversarios = jogadoresDaEquipa
    .slice(0, 3)
    .map((jogador, indice) => ({
        ...jogador,
        posicaoEscolhida: ordemServico[indice]
    }));

    console.log("Equipa adversária:", equipaAdversaria);
    console.log("Jogadores adversários:", jogadoresAdversarios);

    return true;
}

function escolherReceptor(jogadores) {

        );

    return jogadores[indice];
}


/*
=========================================================
RESOLVER SERVIÇO
=========================================================

SERVIÇO vs DEFESA

Diferença >= 15
→ ACE

Diferença >= 5
→ receção difícil

Diferença >= -4
→ receção normal

Diferença < -4
→ receção fácil
*/

function resolverServico(servidor, receptor) {

    let valorServico =
        servidor.servico + rolagem();

    let valorDefesa =
        receptor.defesa + rolagem();

    let diferenca =
        valorServico - valorDefesa;

    console.log(
        servidor.nome +
        " Serviço: " +
        valorServico
    );

    console.log(
        receptor.nome +
        " Defesa: " +
        valorDefesa
    );


    /*
    ACE
    */

    if (diferenca >= 15) {

        return {

            tipo: "ACE",

            servidor: servidor,

            receptor: receptor,

            valorServico: valorServico,

            valorDefesa: valorDefesa,

            dificuldade: 0
        };
    }


    /*
    RECEÇÃO DIFÍCIL
    */

    if (diferenca >= 5) {

        return {

            tipo: "RECEPCAO_DIFICIL",

            servidor: servidor,

            receptor: receptor,

            valorServico: valorServico,

            valorDefesa: valorDefesa,

            dificuldade: diferenca
        };
    }


    /*
    RECEÇÃO NORMAL
    */

    if (diferenca >= -4) {

        return {

            tipo: "RECEPCAO_NORMAL",

            servidor: servidor,

            receptor: receptor,

            valorServico: valorServico,

            valorDefesa: valorDefesa,

            dificuldade: 0
        };
    }


    /*
    RECEÇÃO FÁCIL
    */

    return {

        tipo: "RECEPCAO_FACIL",

        servidor: servidor,

        receptor: receptor,

        valorServico: valorServico,

        valorDefesa: valorDefesa,

        dificuldade: 0
    };
}


/*
=========================================================
ESCOLHER LEVANTADOR
=========================================================

O receptor é excluído.

Dos dois jogadores restantes, escolhemos aquele
com melhor combinação:

60% passe
40% IQ
*/

function escolherLevantador(jogadores, receptor) {

    // Retira o jogador que fez o primeiro toque
    let candidatos = jogadores.filter(
        jogador => jogador.id !== receptor.id
    );

    // Se não houver jogadores disponíveis
    if (candidatos.length === 0) {
        return null;
    }

    // Escolhe aleatoriamente um dos dois jogadores
    let indice = Math.floor(Math.random() * candidatos.length);

    return candidatos[indice];
}


/*
=========================================================
CALCULAR BÓNUS DO LEVANTAMENTO
=========================================================

90+ → +10
80-89 → +7
70-79 → +5
60-69 → +2
45-59 → 0
<45 → -5
*/

function calcularBonusLevantamento(
    valorLevantamento
) {

    if (valorLevantamento >= 90) {

        return 10;
    }

    if (valorLevantamento >= 80) {

        return 7;
    }

    if (valorLevantamento >= 70) {

        return 5;
    }

    if (valorLevantamento >= 60) {

        return 2;
    }

    if (valorLevantamento >= 45) {

        return 0;
    }

    return -5;
}


/*
=========================================================
RESOLVER LEVANTAMENTO
=========================================================

O levantamento utiliza:

60% PASSE
40% IQ
+ sorte
- dificuldade da receção

Depois transforma o resultado num bónus
para o atacante.
*/

function resolverLevantamento(
    levantador,
    resultadoRececao
) {

    let valorPasse =
        levantador.passe * 0.6;

    let valorIQ =
        levantador.iq * 0.4;

    let sorte =
        rolagem();

    let dificuldade =
        resultadoRececao.dificuldade || 0;


    let valorLevantamento =
        valorPasse +
        valorIQ +
        sorte -
        dificuldade;


    /*
    Limitar entre 0 e 100
    */

    valorLevantamento =
        Math.max(
            0,
            Math.min(
                100,
                valorLevantamento
            )
        );


    let bonusAtaque =
        calcularBonusLevantamento(
            valorLevantamento
        );


    console.log(
        levantador.nome +
        " fez o levantamento: " +
        valorLevantamento
    );

    console.log(
        "Bónus de ataque: +" +
        bonusAtaque
    );


    return {

        levantador: levantador,

        valor: valorLevantamento,

        bonusAtaque: bonusAtaque
    };
}


/*
=========================================================
ESCOLHER ATACANTE
=========================================================

O atacante tem de ser:

- diferente do receptor
- diferente do levantador

Num 3x3 sobra exatamente um jogador.
*/

function escolherAtacante(
    jogadores,
    receptor,
    levantador
) {

    let candidatos =
        jogadores.filter(
            jogador =>
                jogador.id !== receptor.id &&
                jogador.id !== levantador.id
        );


    if (candidatos.length === 0) {

        return null;
    }


    /*
    Normalmente haverá apenas um jogador.
    */

    if (candidatos.length === 1) {

        return candidatos[0];
    }


    /*
    Segurança caso no futuro o número
    de jogadores seja diferente.
    */

    candidatos.sort(
        (a, b) =>
            b.ataque - a.ataque
    );


    return candidatos[0];
}


/*
=========================================================
RESOLVER ATAQUE
=========================================================

Ataque recebe:

ataque do jogador
+
bónus do levantamento
+
sorte

Depois enfrenta a defesa do adversário.
*/

function resolverAtaque(
    atacante,
    defensores,
    bonusAtaque
) {

    let valorAtaque =
        atacante.ataque +
        bonusAtaque +
        rolagem();


    let defensor =
        escolherReceptor(
            defensores
        );


    let valorDefesa =
        defensor.defesa +
        rolagem();


    let diferenca =
        valorAtaque -
        valorDefesa;


    console.log(
        atacante.nome +
        " Ataque: " +
        valorAtaque
    );

    console.log(
        defensor.nome +
        " Defesa: " +
        valorDefesa
    );

    console.log(
        "Diferença: " +
        diferenca
    );


    /*
    ATAQUE VENCEDOR
    */

    if (diferenca >= 10) {

        return {

            tipo: "ATAQUE",

            vencedor: atacante,

            defensor: defensor,

            valorAtaque: valorAtaque,

            valorDefesa: valorDefesa
        };
    }


    /*
    A BOLA CONTINUA EM JOGO
    */

    return {

        tipo: "RALLY",

        atacante: atacante,

        defensor: defensor,

        valorAtaque: valorAtaque,

        valorDefesa: valorDefesa
    };
}

            };

    );


    /*
    =====================================================
    3º TOQUE
    ATAQUE
    =====================================================
    */

    let atacante =
        escolherAtacante(
            equipaAtacante,
            receptor,
            levantador
        );


    console.log(
        "3º toque: " +
        atacante.nome +
        " atacou."
    );


    let resultadoAtaque =
        resolverAtaque(
            atacante,
            equipaDefensora,
            resultadoLevantamento.bonusAtaque
        );


    /*
    =====================================================
    ATAQUE VENCEDOR
    =====================================================
    */

    if (
        resultadoAtaque.tipo === "ATAQUE"
    ) {

        darPonto(equipaQueRecebe,atacante,"ATAQUE");
        darPonto(equipaQueRecebe,levantador,"ASSISTENCIA");

        console.log(
            atacante.nome +
            " marcou através de ataque!"
        );


        atualizarPlacar();

        return;
    }


    /*
    =====================================================
    RALLY CONTINUA
    =====================================================

    O ataque não matou a jogada.

    Agora a outra equipa ganha a bola
    e começa os seus próprios 3 toques.
    */

    continuarRally(
        equipaDefensora,
        equipaAtacante,

        equipaQueRecebe === "jogador"
            ? "adversario"
            : "jogador"
    );


    atualizarPlacar();
}


/*
=========================================================
CONTINUAR RALLY
=========================================================

A equipa que defendeu passa a atacar.

Também respeita:

1º toque → receção
2º toque → levantamento
3º toque → ataque
*/

function continuarRally(
    equipaQueDefendeu,
    equipaQueAtacou,
    nomeEquipaDefensora
) {

    console.log(
        "----- RALLY CONTINUA -----"
    );


    /*
    A equipa que acabou de defender
    passa a atacar.
    */

    let receptor =
        escolherReceptor(
            equipaQueDefendeu
        );


    /*
    1º TOQUE
    */

    console.log(
        "1º toque: " +
        receptor.nome +
        " fez a defesa."
    );


    /*
    2º TOQUE
    */

    let levantador =
        escolherLevantador(
            equipaQueDefendeu,
            receptor
        );


    let resultadoLevantamento =
        resolverLevantamento(
            levantador,
            {
                dificuldade: 0
            }
        );


    console.log(
        "2º toque: " +
        levantador.nome +
        " levantou."
    );


    /*
    3º TOQUE
    */

    let atacante =
        escolherAtacante(
            equipaQueDefendeu,
            receptor,
            levantador
        );


    console.log(
        "3º toque: " +
        atacante.nome +
        " atacou."
    );


    /*
    O ataque enfrenta a equipa
    que tinha atacado anteriormente.
    */

    let resultadoAtaque =
        resolverAtaque(
            atacante,
            equipaQueAtacou,
            resultadoLevantamento.bonusAtaque
        );


    /*
    ATAQUE VENCEDOR
    */

    
        if (resultadoAtaque.tipo === "ATAQUE") {

            darPonto(
                nomeEquipaDefensora,
                atacante,
                "ATAQUE"
            );

            // Registar a assistência do levantador
            darPonto(
                nomeEquipaDefensora,
                levantador,
                "ASSISTENCIA"
            );

            console.log(
                atacante.nome +
                " marcou no rally!"
            );

            console.log(
                "Assistência: " +
                levantador.nome
            );

            atualizarPlacar();

            return;
        }


    /*
    Se a bola continuar, vamos fazer
    mais uma troca de ataques.

    Para evitar um loop infinito,
    existe um limite de rallies internos.
    */

    continuarRallyLongo(equipaQueDefendeu,equipaQueAtacou,nomeEquipaDefensora,1);
}


/*
=========================================================
RALLY LONGO
=========================================================

Permite que a jogada continue várias vezes.

O parâmetro numeroTrocas impede que o programa
fique preso num loop infinito.
*/

function continuarRallyLongo(
    equipaA,
    equipaB,
    equipaAtual,
    numeroTrocas) {

    const MAX_TROCAS = 5;


    /*
    Se ultrapassar o limite,
    usamos o físico + sorte para determinar
    quem consegue manter a jogada.
    */

    if (
        numeroTrocas > MAX_TROCAS
    ) {

        let mediaA =
            calcularMediaFisico(
                equipaA
            );

        let mediaB =
            calcularMediaFisico(
                equipaB
            );


        let resultadoA =
            mediaA + rolagem();

        let resultadoB =
            mediaB + rolagem();


        if (
            resultadoA >= resultadoB
        ) {

            let jogador =
                escolherAtacanteAleatorio(
                    equipaA
                );


            darPonto(equipaAtual,jogador,"ATAQUE");

        } else {

            let outraEquipa =
                equipaAtual === "jogador"
                    ? "adversario"
                    : "jogador";


            let jogador =
                escolherAtacanteAleatorio(equipaB);
            darPonto(outraEquipa,jogador,"ATAQUE");
        }


        return;
    }


    /*
    Trocar as equipas
    */

    let novaEquipaAtacante =
        equipaA;

    let novaEquipaDefensora =
        equipaB;


    let nomeEquipaAtacante =
        equipaAtual;


    /*
    Receção
    */

    let receptor =
        escolherReceptor(
            novaEquipaAtacante
        );


    /*
    Levantamento
    */

    let levantador =
        escolherLevantador(
            novaEquipaAtacante,
            receptor
        );


    let resultadoLevantamento =
        resolverLevantamento(
            levantador,
            {
                dificuldade: 0
            }
        );


    /*
    Ataque
    */

    let atacante =
        escolherAtacante(
            novaEquipaAtacante,
            receptor,
            levantador
        );


    let resultadoAtaque =
        resolverAtaque(
            atacante,
            novaEquipaDefensora,
            resultadoLevantamento.bonusAtaque
        );


    /*
    ATAQUE VENCEDOR
    */

    if (resultadoAtaque.tipo === "ATAQUE") {

        darPonto(nomeEquipaAtacante,atacante,"ATAQUE");
        darPonto(nomeEquipaAtacante,levantador,"ASSISTENCIA");
        return;
    }


    /*
    Mais uma troca.
    */

    let proximaEquipa =
        nomeEquipaAtacante === "jogador"
            ? "adversario"
            : "jogador";


    continuarRallyLongo(novaEquipaDefensora,novaEquipaAtacante,proximaEquipa,numeroTrocas + 1);
}


/*
=========================================================
CALCULAR MÉDIA DE FÍSICO
=========================================================
*/

function calcularMediaFisico(jogadores) {

    if (
        jogadores.length === 0
    ) {

        return 0;
    }


    let total = 0;


    jogadores.forEach(
        jogador => {

            total += jogador.fisico;
        }
    );


    return total / jogadores.length;
}


/*
=========================================================
ESCOLHER ATACANTE ALEATÓRIO
=========================================================
*/

function escolherAtacanteAleatorio(
    jogadores
) {

    let indice =
        Math.floor(
            Math.random() *
            jogadores.length
        );


    return jogadores[indice];
}

/*
=========================================================
VERIFICAR FIM DO SET
=========================================================

15 pontos e diferença de pelo menos 2.
*/

function verificarFimDeSet() {

    let setTerminou = false;


    if (jogadorPontos >= PONTOS_PARA_VENCER && jogadorPontos - adversarioPontos >= 2) {
        jogadorSets++;
        setTerminou = true;
        console.log(
            "BARREIRO GANHOU O SET!"
        );

    }
    else if (adversarioPontos >= PONTOS_PARA_VENCER && adversarioPontos - jogadorPontos >= 2) {
        adversarioSets++;
        setTerminou = true;
        console.log(
            equipaAdversaria +
            " GANHOU O SET!"
        );
    }


    if (setTerminou) {

        console.log(
            "Sets: " +
            jogadorSets +
            " - " +
            adversarioSets
        );

        
        if (jogadores1set < 0){
            jogadores1set = jogadorPontos;
        }
        else if (jogadores2set < 0){
            jogadores2set = jogadorPontos;

        }
        else if (jogadores3set < 0){
            jogadores3set = jogadorPontos;
        }
        else if (jogadores4set < 0){
            jogadores4set = jogadorPontos;
        }
        
        else{
            jogadores5set = jogadorPontos;
        }

        
        if (adversario1set < 0){
            adversario1set = adversarioPontos;
        }
        else if (adversario2set < 0){
            adversario2set = adversarioPontos;

        }
        else if (adversario3set < 0){
            adversario3set = adversarioPontos;
        }
        else if (adversario4set < 0){
            adversario4set = adversarioPontos;
        }
        else{
            adversario5set = adversarioPontos;
        }

        historicoSets.push({
            numero: historicoSets.length + 1,
            jogador: jogadorPontos,
            adversario: adversarioPontos,
            vencedor: jogadorPontos > adversarioPontos
            ? "jogador"
            : "adversario"
        });
        
        jogadorPontos = 0;
        adversarioPontos = 0;
        atualizarPlacarSemVerificarSet();
    }

    return setTerminou;
}

function esperar(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function abrirPopupJogo() {
    document.getElementById("match-overlay").hidden = false;

    document.getElementById("match-title").textContent =
        "Jogo em andamento";

    document.getElementById("match-home-name").textContent =
        "Barreiro";

    document.getElementById("match-away-name").textContent =
        equipaAdversaria;

    document.getElementById("match-home-score").textContent = "0";
    document.getElementById("match-away-score").textContent = "0";
    document.getElementById("match-home-sets").textContent = "0";
    document.getElementById("match-away-sets").textContent = "0";

    document.getElementById("match-sets-list").innerHTML = "";
    document.getElementById("match-status").textContent =
        "O jogo vai começar...";

    document.getElementById("match-statistics").hidden = true;
    document.getElementById("match-finish").hidden = true;
}

function atualizarPopupPlacar() {
    document.getElementById("match-home-score").textContent =
        jogadorPontos;

    document.getElementById("match-away-score").textContent =

}

function mostrarResultadoSet(set) {
    const lista = document.getElementById("match-sets-list");

    // Retira a mensagem inicial, se existir.
    if (historicoSets.length === 1) {
        lista.innerHTML = "";
    }

    const linha = document.createElement("div");
    linha.className = "set-result " +
        (set.vencedor === "jogador" ? "set-won" : "set-lost");

    const nome = document.createElement("span");
    nome.textContent = "Set " + set.numero;

    const resultado = document.createElement("strong");
    resultado.textContent = set.jogador + " : " + set.adversario;

    const vencedor = document.createElement("small");
    vencedor.textContent = set.vencedor === "jogador"
        ? "Vitória"
        : "Derrota";

    linha.append(nome, resultado, vencedor);
    lista.appendChild(linha);
}

function mostrarEstatisticasNoPopup() {
    const lista = document.getElementById("statistics-list");
    lista.innerHTML = "";

    const cabecalho = document.createElement("div");
    cabecalho.className = "stat-row stat-head";

    ["Jogador", "Pontos", "Ataques", "Aces", "Assist."].forEach(texto => {
        const celula = document.createElement("span");
        celula.textContent = texto;
        cabecalho.appendChild(celula);
    });

    lista.appendChild(cabecalho);

    jogadoresEscolhidos.forEach(jogador => {
        const stats = estatisticasJogadores[jogador.id];
        if (!stats) return;

        const linha = document.createElement("div");
        linha.className = "stat-row";

        [
            stats.nome,
            stats.pontos,
            stats.ataques,
            stats.aces,
            stats.assistencias
        ].forEach(valor => {
            const celula = document.createElement("span");
            celula.textContent = valor;
            linha.appendChild(celula);
        });

        lista.appendChild(linha);
    });

    document.getElementById("match-statistics").hidden = false;
}
    
    async function iniciarJogo() {
        const botao = document.getElementById("start-game");

        if (jogadoresEscolhidos.length !== 3) {
            alert("Tens de escolher os 3 jogadores antes de começar.");
            return;
        }

        botao.disabled = true;

        try {
            // Reiniciar o estado do jogo.
            jogadorPontos = 0;
            adversarioPontos = 0;
            jogadorSets = 0;
            adversarioSets = 0;
            estatisticasJogadores = {};
            historicoSets = [];

            jogadores1set = -1;
            jogadores2set = -1;
            jogadores3set = -1;
            jogadores4set = -1;
            jogadores5set = -1;

            adversario1set = -1;
            adversario2set = -1;
            adversario3set = -1;
            adversario4set = -1;
            adversario5set = -1;

            sortearEquipeAdversaria();

            const sucesso = await construirEquipaAdversaria();

            if (!sucesso) {
                alert("Não foi possível construir a equipa adversária.");
                return;
            }

            inicializarEstatisticas(jogadoresEscolhidos);
            inicializarEstatisticas(jogadoresAdversarios);

            abrirPopupJogo();

            // Permite ao navegador desenhar o popup antes de começar.
            await esperar(100);

            let setsApresentados = 0;

            while (!verificarFimDeJogo()) {
                const setsAntes = jogadorSets + adversarioSets;

                jogarRally();

                atualizarPopupPlacar();

                // Pequena pausa entre rallies para o marcador ser visível.
                await esperar(350);

                const setsDepois = jogadorSets + adversarioSets;

                if (setsDepois > setsAntes) {
                    const ultimoSet = historicoSets[historicoSets.length - 1];

                    if (ultimoSet && setsApresentados < historicoSets.length) {
                        mostrarResultadoSet(ultimoSet);
                        setsApresentados++;

                        document.getElementById("match-status").textContent =
                            ultimoSet.vencedor === "jogador"
                                ? "O Barreiro venceu o set!"
                                : equipaAdversaria + " venceu o set!";

                        atualizarPopupPlacar();

                        // Tempo para o utilizador ler o resultado do set.
                        await esperar(1800);
                    }
                }
            }

            atualizarPopupPlacar();

            document.getElementById("match-title").textContent =
                jogadorSets === 3
                    ? "VITÓRIA DO BARREIRO!"
                    : "DERROTA DO BARREIRO";

            document.getElementById("match-status").textContent =
                "Resultado final: " + jogadorSets + " - " + adversarioSets;

            mostrarEstatisticasNoPopup();

            document.getElementById("match-finish").hidden = false;

        } catch (erro) {
            console.error("Erro ao iniciar o jogo:", erro);
            alert("Ocorreu um erro ao iniciar o jogo. Consulta a consola para ver o erro.");
        } finally {
            botao.disabled = false;
        }
    }

    document.getElementById("close-match").addEventListener("click", () => {
    document.getElementById("match-overlay").hidden = true;
});

document.getElementById("match-finish").addEventListener("click", () => {
    document.getElementById("match-overlay").hidden = true;
});
