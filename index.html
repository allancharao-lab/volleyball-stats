<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Volleyball status</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ececec;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;
}

.container{
    display:flex;
    gap:50px;
    align-items:center;
    flex-wrap:wrap;
}

/* PAINEL */
.panel{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);

    display:grid;
    grid-template-columns:repeat(2, 1fr);

    gap:20px;

    min-width:500px;
}

/* HEADER */
.panel-header{
    grid-column:1 / -1;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#f7f7f7;

    padding:15px 20px;
    border-radius:15px;

    margin-bottom:5px;
}

.info-box{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.info-title{
    font-size:14px;
    color:#777;
}

.info-value{
    font-size:26px;
    font-weight:bold;
    color:#111;
}

/* STATS */
.stat{
    background:#f7f7f7;
    padding:15px;
    border-radius:15px;
}

.stat-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-weight:bold;
    font-size:18px;
}

.stat-input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    margin-bottom:10px;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    border:none;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.plus{
    background:#16a34a;
    color:white;
}

.minus{
    background:#dc2626;
    color:white;
}

button:hover{
    transform:scale(1.05);
}

.restart{
    grid-column:1 / -1;

    background:#2563eb;
    color:white;

    padding:12px;
    font-size:18px;

    margin-top:5px;
}

/* HEX */
svg{
    width:500px;
    height:500px;
}

.label{
    fill:#d63d32;
    font-size:24px;
    font-weight:bold;
}

.grid{
    fill:none;
    stroke:#333;
    stroke-width:2;
}

.line{
    stroke:#777;
    stroke-width:1;
}

.stats-area{
    fill:#00c853;
    fill-opacity:.7;
    stroke:#009624;
    stroke-width:3;
}

</style>
</head>

<body>

<div class="container">

    <svg viewBox="0 0 600 600">

        <!-- HEX -->
        <polygon 
            class="grid"
            points="
            300,80
            470,180
            470,380
            300,480
            130,380
            130,180
            "
        />

        <!-- LINHAS -->
        <line class="line" x1="300" y1="280" x2="300" y2="80"/>
        <line class="line" x1="300" y1="280" x2="470" y2="180"/>
        <line class="line" x1="300" y1="280" x2="470" y2="380"/>
        <line class="line" x1="300" y1="280" x2="300" y2="480"/>
        <line class="line" x1="300" y1="280" x2="130" y2="380"/>
        <line class="line" x1="300" y1="280" x2="130" y2="180"/>

        <!-- LABELS -->
        <text class="label" x="270" y="50">Spike</text>
        <text class="label" x="450" y="160">Jump</text>
        <text class="label" x="470" y="395">Set</text>
        <text class="label" x="270" y="535">Pass</text>
        <text class="label" x="95" y="425">Defense</text>
        <text class="label" x="50" y="160">Block</text>

        <!-- ÁREA -->
        <polygon id="statsPolygon" class="stats-area"></polygon>

    </svg>

    <div class="panel" id="controls">

        <!-- HEADER -->
        <div class="panel-header">

            <div class="info-box">
                <span class="info-title">Média</span>
                <span class="info-value" id="mediaLabel">0</span>
            </div>

            <div class="info-box">
                <span class="info-title">Rank</span>
                <span class="info-value" id="classLabel">D</span>
            </div>

        </div>

    </div>

</div>

<script>

const stats = {
    Spike: 50,
    Jump: 50,
    Set: 50,
    Pass: 50,
    Defense: 50,
    Block: 50
};

const maxStat = 100;

const directions = [
    { key:"Spike", angle:-90 },
    { key:"Jump", angle:-30 },
    { key:"Set", angle:30 },
    { key:"Pass", angle:90 },
    { key:"Defense", angle:150 },
    { key:"Block", angle:210 }
];

const centerX = 300;
const centerY = 280;
const radius = 200;

const polygon = document.getElementById("statsPolygon");
const controls = document.getElementById("controls");

function restartStats(){

    for(const key in stats){

        stats[key] = 0;

        document.getElementById(`${key}-value`).innerText = 0;

        const input = document.getElementById(`${key}-input`);

        if(input){
            input.value = 0;
        }
    }

    updatePolygon();
    atualizarMedia();
}

function mediaTotal(stats){

    const soma = Object.values(stats).reduce((acc, valor) => {
        return acc + valor;
    }, 0);

    return (soma / 6).toFixed(2);
}

function atualizarMedia(){

    const media = Number(mediaTotal(stats));

    document.getElementById("mediaLabel").textContent = media;

    let rank = "";

    if(media < 1){
        rank = "F";
    }
    else if(media <= 20){
        rank = "D";
    }
    else if(media <= 30){
        rank = "D+";
    }
    else if(media <= 40){
        rank = "C";
    }
    else if(media <= 50){
        rank = "C+";
    }
    else if(media <= 60){
        rank = "B";
    }
    else if(media <= 70){
        rank = "B+";
    }
    else if(media <= 80){
        rank = "A";
    }
    else if(media <= 90){
        rank = "A+";
    }
    else if(media < 100){
        rank = "S";
    }
    else{
        rank = "S+";
    }

    document.getElementById("classLabel").textContent = rank;
}

function createControls(){

    for(const key in stats){

        const div = document.createElement("div");

        div.className = "stat";

        div.innerHTML = `
            <div class="stat-header">
                <span>${key}</span>
                <span id="${key}-value">${stats[key]}</span>
            </div>

            <input
                id="${key}-input"
                class="stat-input"
                type="number"
                min="0"
                max="${maxStat}"
                value="${stats[key]}"
                oninput="setStat('${key}', this.value)"
            >

            <div class="buttons">
                <button class="minus" onclick="changeStat('${key}', -1)">-</button>
                <button class="plus" onclick="changeStat('${key}', 1)">+</button>
            </div>
        `;

        controls.appendChild(div);
    }

    const restartBtn = document.createElement("button");

    restartBtn.className = "restart";
    restartBtn.innerText = "Restart";

    restartBtn.onclick = restartStats;

    controls.appendChild(restartBtn);
}

function setStat(key, value){

    let newValue = parseInt(value);

    if(isNaN(newValue))
        newValue = 0;

    if(newValue < 0)
        newValue = 0;

    if(newValue > maxStat)
        newValue = maxStat;

    stats[key] = newValue;

    document.getElementById(`${key}-value`).innerText = newValue;

    updatePolygon();
    atualizarMedia();
}

function changeStat(key, amount){

    stats[key] += amount;

    if(stats[key] < 0)
        stats[key] = 0;

    if(stats[key] > maxStat)
        stats[key] = maxStat;

    document.getElementById(`${key}-value`).innerText = stats[key];

    document.getElementById(`${key}-input`).value = stats[key];

    updatePolygon();
    atualizarMedia();
}

function updatePolygon(){

    const points = directions.map(dir => {

        const value = stats[dir.key];

        const percent = value / maxStat;

        const r = radius * percent;

        const angle = (Math.PI / 180) * dir.angle;

        const x = centerX + Math.cos(angle) * r;

        const y = centerY + Math.sin(angle) * r;

        return `${x},${y}`;
    });

    polygon.setAttribute("points", points.join(" "));
}

createControls();
updatePolygon();
atualizarMedia();

</script>

</body>
</html>
